 --wb:#3F2E0E;--wt:#F0C878;--sky:#57AFDC;
 --map-bg:#0E1A2B;--map-block:#162840;--map-road:#2A3F5C;--map-park:#173A2B;--map-water:#12385A;--route:#57AFDC;
 --red:#F5A399;--redb:#47201C;--focus:#D8A24C;--ov:rgba(0,0,0,.6);color-scheme:dark;}}
:root[data-theme="dark"]{
 --bg:#0B1626;--surface:#12213A;--surface-2:#192C4A;--ink:#EEF1F5;--muted:#A3AFBF;--line:#26405F;
 --primary:#2071C9;--ptext:#8EC6EA;--soft:#1C3354;--lime:#D8A24C;--lime-ink:#10243E;
 --z1b:#1C3354;--z1t:#B9CDE6;--z2b:#14385A;--z2t:#A9D2F5;--z3b:#3F2E0E;--z3t:#F0C878;--z4b:#14382A;--z4t:#93D9AE;
 --wb:#3F2E0E;--wt:#F0C878;--sky:#57AFDC;
 --map-bg:#0E1A2B;--map-block:#162840;--map-road:#2A3F5C;--map-park:#173A2B;--map-water:#12385A;--route:#57AFDC;
 --red:#F5A399;--redb:#47201C;--focus:#D8A24C;--ov:rgba(0,0,0,.6);color-scheme:dark;}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:'Figtree','Noto Sans Sinhala',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--ptext)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1{font-size:34px;line-height:1.05;margin:0;font-family:'Tanker','Noto Sans Sinhala','Arial Narrow',Impact,sans-serif;font-weight:400;letter-spacing:.01em}
h2{font-size:19px;margin:0;font-weight:700;display:flex;align-items:center;gap:10px}
h3{font-size:17px;margin:0 0 12px;font-weight:700;display:flex;align-items:center;gap:10px}
.muted{color:var(--muted)}.small{font-size:15px}
.ic{flex:none}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:12px 24px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:'Tanker','Noto Sans Sinhala','Arial Narrow',Impact,sans-serif;font-weight:400;font-size:24px;letter-spacing:.02em;white-space:nowrap}
.nav{display:flex;gap:2px;flex-wrap:nowrap;overflow:auto}
.nav a{display:flex;align-items:center;gap:6px;padding:10px 12px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:600;white-space:nowrap;font-size:15.5px}
.nav a.on{background:var(--surface-2);color:var(--ink)}
.nav a.on .ic{color:var(--ptext)}
.tools{margin-left:auto;display:flex;gap:8px;align-items:center}
.iconbtn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.langbtn{height:46px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;cursor:pointer;white-space:nowrap}
.who{display:flex;align-items:center;gap:8px;height:46px;padding:0 12px 0 4px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.av{width:44px;height:44px;border-radius:50%;background:var(--soft);color:var(--ptext);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.av.sm{width:36px;height:36px;font-size:13px}
main{max-width:1280px;margin:0 auto;padding:28px 24px 120px}
.bnav{display:none}
@media (max-width:1439px){.who-n{display:none}.who{padding:0 4px}}
@media (max-width:1239px){
 .nav{display:none}.who-n{display:none}
 .top-in{padding:10px 16px;gap:10px}
 main{padding:18px 14px calc(110px + env(safe-area-inset-bottom,0px))}
 .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
 .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:60px;text-decoration:none;color:var(--muted);font-size:13px;font-weight:700;border-radius:14px;text-align:center;line-height:1.15}
 .bnav a .ic{padding:4px 14px;border-radius:999px;box-sizing:content-box}
 .bnav a.on{color:var(--ink)}
 .bnav a.on .ic{background:var(--lime);color:var(--lime-ink)}
 h1{font-size:30px}
}


/* layout */
.grid{display:grid;gap:16px;margin-bottom:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
@media (max-width:1050px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g21{grid-template-columns:1fr}}
@media (max-width:760px){.g3,.g2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;min-width:0}
section.card{margin-bottom:16px}
.grid>section.card{margin-bottom:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.hello{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.hello p{margin:6px 0 0}
.hello-act{display:flex;gap:10px;flex-wrap:wrap}
.chipic{width:38px;height:38px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--ptext);flex:none}

/* buttons */
.btn{min-height:52px;padding:0 22px;border-radius:999px;border:0;font-weight:700;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;background:var(--surface-2);color:var(--ink);text-decoration:none;border:1px solid var(--line);white-space:nowrap}
.btn.pri{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn.lime{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.btn.ghost{background:transparent}
.btn.bad{background:var(--redb);color:var(--red);border-color:transparent}
.btn.big{min-height:62px;font-size:18px;width:100%;white-space:normal;text-align:center}
.btn.sm{min-height:42px;padding:0 16px;font-size:15px}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.55;cursor:default}
.lnk{background:none;border:0;color:var(--ptext);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:8px 0;font-size:16px}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:16px}

/* stats */
.stat{display:flex;flex-direction:column;gap:14px;text-align:left;cursor:pointer;font:inherit;color:inherit}
.stat:hover{border-color:var(--soft)}
.st-l{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--muted);font-size:16px}
.st-n{font-size:52px;font-family:'Tanker','Noto Sans Sinhala','Arial Narrow',Impact,sans-serif;font-weight:400;letter-spacing:.01em;line-height:1}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:14px;font-weight:700;white-space:nowrap;line-height:1.3}
.pill.z1{background:var(--z1b);color:var(--z1t)}.pill.z2{background:var(--z2b);color:var(--z2t)}.pill.z3{background:var(--z3b);color:var(--z3t)}.pill.z4{background:var(--z4b);color:var(--z4t)}
.pill.ok{background:var(--z4b);color:var(--z4t)}.pill.warn{background:var(--wb);color:var(--wt)}.pill.bad{background:var(--redb);color:var(--red)}
.pill.plain{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.tag{display:inline-block;padding:1px 8px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);font-weight:700;font-size:13px;color:var(--ink);margin-right:6px}

/* pipeline: the box journey across two countries */
.pipe{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));row-gap:16px;align-items:start}
.band{grid-row:1;grid-column:var(--c);text-align:center;font-weight:800;font-size:14px;padding:8px;border-radius:12px;margin:0 4px}
.band.b-il{background:var(--z1b);color:var(--z1t)}.band.b-sea{background:var(--z2b);color:var(--z2t)}.band.b-sl{background:var(--z3b);color:var(--z3t)}
.pstop{grid-row:2;grid-column:var(--c);display:flex;flex-direction:column;align-items:center;gap:10px;background:none;border:0;cursor:pointer;position:relative;padding:4px 2px;border-radius:16px;text-align:center}
.pstop::before{content:'';position:absolute;top:34px;right:50%;width:100%;height:4px;background:repeating-linear-gradient(90deg,var(--soft) 0 10px,transparent 10px 16px)}
.pstop:first-of-type::before{display:none}
.pdot{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);position:relative;z-index:1;color:var(--ptext)}
.pdot b{position:absolute;top:-8px;right:-10px;min-width:30px;height:30px;padding:0 8px;border-radius:999px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:15px}
.pstop.has .pdot{border-color:var(--primary)}
.pstop.zero .pdot b{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pstop.hot .pdot{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.pl{font-weight:700;font-size:14.5px;line-height:1.25;max-width:110px}
.pstop:hover .pdot{transform:translateY(-2px)}
@media (max-width:760px){
 .pipe{grid-template-columns:1fr 1fr;gap:10px}
 .band{display:none}
 .pstop{grid-column:auto;grid-row:auto;flex-direction:row;justify-content:flex-start;text-align:left;border:1px solid var(--line);padding:10px;gap:12px}
 .pstop::before{display:none}
 .pdot{width:46px;height:46px}
 .pdot b{top:-6px;right:-8px;min-width:26px;height:26px;font-size:13px}
}

/* journey track for a single box */
.track{display:flex;align-items:flex-start}
.stop{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;text-align:center;min-width:0}
.stop::before{content:'';position:absolute;top:22px;right:50%;width:100%;height:4px;background:var(--line);border-radius:4px}
.stop:first-child::before{display:none}
.stop.done::before,.stop.cur::before{background:var(--primary)}
.dot{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);position:relative;z-index:1;border:2px solid var(--line)}
.stop.done .dot{background:var(--primary);border-color:var(--primary);color:#fff}
.stop.cur .dot{background:var(--lime);border-color:var(--lime);color:var(--lime-ink);box-shadow:0 0 0 7px rgba(216,162,76,.35)}
.sl{font-size:13.5px;font-weight:600;color:var(--muted);margin-top:10px;padding:0 2px;line-height:1.2}
.stop.cur .sl,.stop.done .sl{color:var(--ink)}
.stop.cur .sl{font-weight:800}
.track.sm .stop::before{top:15px;height:3px}
.track.sm .dot{width:32px;height:32px;border-width:1.5px}
.track.sm .stop.cur .dot{box-shadow:0 0 0 5px rgba(216,162,76,.35)}
.track.sm .sl{display:none}
@media (max-width:640px){.track .sl{display:none}.track:not(.sm) .dot{width:36px;height:36px}.track:not(.sm) .stop::before{top:17px}}
@media (prefers-reduced-motion:no-preference){.stop.cur .dot{animation:pulse 2.2s ease-in-out infinite}}
@keyframes pulse{50%{box-shadow:0 0 0 11px rgba(214,240,106,.18)}}
.say{font-size:22px;font-weight:800;margin:22px 0 0;letter-spacing:-.01em;line-height:1.3}
.eta{display:flex;align-items:center;gap:14px;margin-top:16px;padding:14px 16px;border-radius:16px;background:var(--wb);color:var(--wt);font-weight:700}
.eta b{font-size:24px;display:block;color:var(--ink)}

/* rows */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:14px 12px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%;border-radius:0}
.rows .row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.r-main{min-width:0;display:flex;flex-direction:column;gap:3px}
.r-main b{font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-main small{color:var(--muted);font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.r-end{font-weight:800;text-align:right;white-space:nowrap}
@media (max-width:640px){.row{grid-template-columns:auto minmax(0,1fr) auto;padding:14px 6px}.row>.ic:last-child{display:none}.r-pills{flex-direction:column;align-items:flex-end}}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty p{margin:10px 0 16px;font-weight:600}

/* key value */
.kv{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}
.kv span{color:var(--muted)}
.kv b{text-align:right;font-weight:700;overflow-wrap:anywhere}

/* forms */
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.field>label,.flabel{font-weight:700;font-size:15.5px}
input,select,textarea{font:inherit;font-size:17px;min-height:54px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--focus);outline:none}
.in-big{font-size:34px;font-weight:800;text-align:center;min-height:76px}
.row-in{display:flex;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -2px 14px}
.chip{min-height:46px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.chip .n{font-size:13px;opacity:.8}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.note{padding:12px 14px;border-radius:14px;background:var(--surface-2);font-size:15px;color:var(--muted);margin:0 0 14px}
.warnbox{padding:14px 16px;border-radius:14px;background:var(--wb);color:var(--wt);font-weight:700;margin-bottom:16px}
.pricebox{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:16px;background:var(--z3b);color:var(--z3t);font-weight:700;margin-bottom:16px}
.pricebox b{font-size:24px;color:var(--ink)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;font-weight:700;cursor:pointer}
.switch input{width:26px;height:26px;min-height:0;accent-color:var(--primary)}
.check{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-weight:600;cursor:pointer}
.check input{width:24px;height:24px;min-height:0;accent-color:var(--primary);flex:none}

/* modal */
.ov{position:fixed;inset:0;background:var(--ov);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px))}
.m-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.m-h h2{font-size:21px}
.m-f{display:flex;gap:10px;margin-top:6px}
.m-f .btn{flex:1}
@media (min-width:700px){.ov{align-items:center}.modal{border-radius:26px;padding:24px}}

/* toast */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:#0F2F37;color:#fff;padding:14px 18px;border-radius:16px;display:flex;align-items:center;gap:10px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast .ic{color:#7BE495}
@media (min-width:1240px){#toast{bottom:28px}}

/* login */
.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:linear-gradient(160deg,#10243E 0%,#1C3A5E 50%,#2071C9 100%)}
.lg-card{width:100%;max-width:480px;background:var(--surface);border-radius:28px;padding:26px 22px}
.lg-brand{display:flex;align-items:center;gap:10px;font-family:'Tanker','Noto Sans Sinhala','Arial Narrow',Impact,sans-serif;font-weight:400;font-size:26px;letter-spacing:.02em}
.lg-brand .langbtn{margin-left:auto}
.lg-tag{color:var(--muted);margin:8px 0 22px}
.lg-h{font-size:24px;margin:6px 0 16px}
.lg-roles,.lg-list{display:flex;flex-direction:column;gap:10px}
.lg-role{display:flex;align-items:center;gap:16px;padding:16px;border-radius:20px;border:1.5px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:19px;font-weight:800;text-align:left}
.lg-role>span:nth-child(2){flex:1}
.lg-ic{width:58px;height:58px;border-radius:16px;background:var(--primary);color:var(--lime);display:grid;place-items:center}
.lg-person{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;text-align:left}
.lg-person span{display:flex;flex-direction:column}
.lg-person small{color:var(--muted);font-size:14.5px}
.lg-list{max-height:52vh;overflow:auto}
.pin-dots{display:flex;justify-content:center;gap:16px;margin:10px 0 8px}
.pin-dots i{width:20px;height:20px;border-radius:50%;border:2px solid var(--primary)}
.pin-dots i.f{background:var(--primary)}
.pin-err{color:var(--red);text-align:center;font-weight:700;min-height:24px;margin:0 0 6px}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:320px;margin:0 auto}
.pinpad button{height:72px;border-radius:22px;border:1.5px solid var(--line);background:var(--surface-2);font-size:28px;font-weight:800;cursor:pointer;display:grid;place-items:center}
.pinpad button.ghost{background:transparent;border-color:transparent}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.hint{text-align:center;color:var(--muted);font-size:15px;margin-top:14px}

/* misc blocks */
.money{display:grid;gap:12px}
.money>div{padding:14px 16px;border-radius:16px;background:var(--surface-2);display:flex;justify-content:space-between;align-items:center;gap:10px}
.money small{color:var(--muted);font-weight:600;font-size:15px}
.money b{font-size:22px;letter-spacing:-.01em}
.money .due{background:var(--wb)}
.money .due small{color:var(--wt)}
.bars{display:flex;align-items:flex-end;gap:12px;height:190px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.bar i{display:block;width:100%;border-radius:14px;background-color:var(--primary);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.13) 0 2px,transparent 2px 9px);position:relative}
.bar.now i{background-color:var(--lime);background-image:repeating-linear-gradient(135deg,rgba(0,0,0,.06) 0 2px,transparent 2px 9px)}
.bar span{font-size:13.5px;color:var(--muted);font-weight:600}
.bar em{font-style:normal;font-weight:800;font-size:14px}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:grid;grid-template-columns:14px 1fr;gap:12px;padding:0 0 16px;position:relative}
.hist li::before{content:'';width:12px;height:12px;border-radius:50%;background:var(--primary);margin-top:6px}
.hist li::after{content:'';position:absolute;left:5px;top:20px;bottom:0;width:2px;background:var(--line)}
.hist li:last-child::after{display:none}
.hist b{display:block}
.hist small{color:var(--muted)}

/* swipe rows: no scrollbars, drag/swipe instead */
.nav,.chips.scroll{scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;cursor:grab}

.nav.drag,.chips.scroll.drag{cursor:grabbing;user-select:none}
.chips.scroll{padding-bottom:0;--fl:0px;--fr:48px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 var(--fl),#000 calc(100% - var(--fr)),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 var(--fl),#000 calc(100% - var(--fr)),transparent 100%)}

/* ---------------- helpers ---------------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function isoLocal(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const dayISO=o=>isoLocal(new Date(Date.now()+o*D));
const loc=()=>S.lang==='si'?'si-LK':'en-GB';
function fd(v){if(!v)return '—';const d=typeof v==='number'?new Date(v):new Date(v+'T00:00:00');if(isNaN(d))return '—';try{return d.toLocaleDateString(loc(),{day:'numeric',month:'short'})}catch(e){return d.toDateString().slice(4,10)}}
function fdt(ts){const d=new Date(ts);try{return d.toLocaleDateString(loc(),{day:'numeric',month:'short'})+', '+d.toLocaleTimeString(loc(),{hour:'2-digit',minute:'2-digit'})}catch(e){return d.toLocaleString()}}
function dayWord(iso){if(iso===dayISO(0))return T('today');if(iso===dayISO(1))return T('tomorrow');return fd(iso)}
const ils=n=>'₪'+Math.round(n||0).toLocaleString('en-US');
const lkr=n=>'Rs '+Math.round(n||0).toLocaleString('en-US');

const mapHref=a=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a||'');

const B=id=>DB.boxes.find(b=>b.id===id);
const K=id=>DB.containers.find(k=>k.id===id);

const R=id=>DB.roles.find(r=>r.id===id);
const roleName=r=>r?(S.lang==='si'&&r.si?r.si:r.name):'—';
const sIdx=s=>STG.indexOf(s);
function zone(s){const i=sIdx(s);return i<=2?1:i===3?2:i<=6?3:4}
function can(p){if(!S.user)return false;if(S.user.t==='admin')return true;if(S.user.t!=='staff')return false;const s=ST(S.user.id);const r=s&&R(s.role);return !!(r&&r.perms.includes(p))}

function paidOf(b){return (b.pays||[]).reduce((a,p)=>a+(p.cur==='LKR'?p.amt/DB.settings.lkrRate:p.amt),0)}
function bal(b){return Math.max(0,Math.round((b.price||0)-paidOf(b)))}
function payState(b){if(!b.price)return 'none';const p=paidOf(b);if(p>=b.price-0.5)return 'paid';if(p>0)return 'part';return 'unpaid'}
function stLabel(b){return b.status==='out'&&b.mode==='point'?T('ready'):T('s_'+b.status)}
function stagePill(b){return `<span class="pill z${zone(b.status)}">${stLabel(b)}</span>`}
function payPill(b){const p=payState(b);if(p==='paid')return `<span class="pill ok">${ic('check',14)}${T('paid')}</span>`;if(p==='part')return `<span class="pill warn">${T('partPaid')}</span>`;if(p==='unpaid')return `<span class="pill bad">${T('unpaid')}</span>`;return ''}
function itemName(k){return L[k]?T(k):k}
function kv(l,v){return `<div class="kv"><span>${l}</span><b>${v}</b></div>`}
function telLink(p){return p?`<a href="${telHref(p)}">${esc(p)}</a>`:'—'}
function sentence(b){
 const s=b.status;
 if(s==='booked')return b.onWay?T('driverOnWay'):tf('x_booked',{d:dayWord(b.pickupDate)});
 if(s==='shipped')return tf('x_shipped',{d:fd(b.eta)});
 if(s==='sl_wh')return b.addrOk?T('x_sl_wh_ok'):T('x_sl_wh');
 if(s==='out')return b.mode==='point'?tf('x_ready',{p:b.point}):T('x_out');
 if(s==='delivered')return tf('x_delivered',{d:fd(b.deliveredAt)});
 return T('x_'+s);
}

function setStatus(b,st,silent){
 b.status=st;b.hist.push({st,at:Date.now(),by:myName()});
 if(st==='delivered')b.deliveredAt=Date.now();
 if(st!=='booked')b.onWay=false;
 let key='n_'+st,p={id:b.id};
 if(st==='booked')p.d=fd(b.pickupDate);
 if(st==='picked'){p.kg=b.weight;p.price=ils(b.price)}
 if(st==='shipped')p.eta=fd(b.eta);
 if(st==='sl_wh')p.point=DB.settings.points[0]||'';
 if(st==='out'&&b.mode==='point'){key='n_ready';p.point=b.point}
 notify(b,key,p,silent);
}
function notify(b,key,p,silent){
 DB.msgs.unshift({id:'m'+Date.now()+Math.random().toString(36).slice(2,6),cust:b.cust,box:b.id,key,p,at:Date.now()});
 if(!silent)toast(tf('waSent',{n:C(b.cust).name.split(' ')[0]}),'msg');
}
function toast(text,icn='check'){
 const el=document.createElement('div');el.className='toast';el.innerHTML=ic(icn,20)+'<span>'+esc(text)+'</span>';
 $('toast').appendChild(el);setTimeout(()=>el.remove(),3200);
}
function gateNeed(b,target){
 const r=DB.settings.payRule;if(!b.price)return 0;const paid=paidOf(b);
 if(r==='split'){if(target==='il_wh'&&paid<b.price/2-0.5)return Math.ceil(b.price/2-paid);if(target==='delivered')return bal(b);return 0}
 const at={before:'picked',at:'il_wh',delivery:'delivered'}[r];
 if(!at)return 0;return sIdx(target)>=sIdx(at)?bal(b):0;
}
function guard(b,target,cb){const n=gateNeed(b,target);if(n>0){S.after=cb;openPay(b.id,n)}else cb()}

function actionsFor(b){
 const a=[],s=b.status,A=(l,i,fn,cls)=>a.push({l,i,fn,cls});
 if(s==='booked'&&can('pickup')){if(!b.onWay)A(T('actOnWay'),'truck',`actOnWay('${b.id}')`,'');A(T('actPicked'),'check',`openWeigh('${b.id}')`,'pri')}
 if(s==='picked'&&can('wh_il'))A(T('actWh'),'warehouse',`actCheckIn('${b.id}')`,'pri');
 if(s==='il_wh'&&can('wh_il')&&!b.cont)A(T('actContainer'),'container',`openLoad('${b.id}')`,'pri');
 if((s==='shipped'||s==='customs')&&can('wh_sl'))A(T('actArrived'),'pin',`actArrive('${b.id}')`,'pri');
 if(s==='sl_wh'&&can('wh_sl')){A(b.addrOk?T('changeDelivery'):T('confirmAddress'),'map',`openAddr('${b.id}')`,b.addrOk?'':'pri');if(b.addrOk)A(b.mode==='point'?T('actReady'):T('actOut'),'truck',`openSendOut('${b.id}')`,'pri')}
 if(s==='out'&&(can('deliver')||can('wh_sl')))A(T('actDelivered'),'checkc',`openDeliver('${b.id}')`,'lime');

 if(['picked','il_wh'].includes(s)&&can('wh_il'))A(T('printLabel'),'print',`openLabel('${b.id}')`,'ghost');
 return a;
}

function actOnWay(id){const b=B(id);b.onWay=true;b.hist.push({st:'onway',at:Date.now(),by:myName()});notify(b,'n_onway',{id:b.id});done()}

 <div class="field" id="ptWrap" style="display:${mode==='point'?'flex':'none'}"><label for="apt">${T('pickupPoint')}</label><select id="apt">${DB.settings.points.map(p=>`<option ${p===b.point?'selected':''}>${esc(p)}</option>`).join('')}</select></div>

 <div class="field"><label for="aad">${T('slAddr')}</label><textarea id="aad">${esc(b.to.addr)}</textarea></div>`,

function openPay(id,need){const b=B(id),due=bal(b),gate=!!need;
 modal(T('collect'),`${gate?`<div class="warnbox">${tf('payFirst',{a:ils(need)})}</div>`:''}
 <div class="pricebox"><span>${T('balance')}</span><b>${ils(due)}</b></div>
 <div class="field"><span class="flabel">${T('currency')}</span>${chipsHTML('cur',[['ILS','₪ Shekel'],['LKR','Rs Rupee']],'ILS')}</div>
 <div class="field"><label for="pamt">${T('amount')}</label><input id="pamt" class="in-big" type="number" inputmode="decimal" min="0" value="${due}"></div>
 <div class="field"><span class="flabel">${T('method')}</span>${chipsHTML('pm',[['cash',T('cash')],['card',T('card')],['bank',T('bank')]],'cash')}</div>`,
 `${gate&&S.user.t==='admin'?`<button class="btn" onclick="skipGate()">${T('skip')}</button>`:`<button class="btn" onclick="S.after=null;closeM()">${T('cancel')}</button>`}<button class="btn pri" onclick="savePay('${id}')">${ic('check')} ${T('save')}</button>`);
 CHIPCB.cur=v=>{$('pamt').value=v==='LKR'?Math.round(due*DB.settings.lkrRate):due}}
function savePay(id){const b=B(id),amt=parseFloat($('pamt').value),cur=cv('cur')||'ILS',m=cv('pm')||'cash';if(!(amt>0))return;
 addPay(b,amt,cur,m);closeM();const cb=S.after;S.after=null;save();

/* ---------------- modal + chips ---------------- */
const CHIPCB={};
function modal(title,body,foot){for(const k in CHIPCB)delete CHIPCB[k];
 $('modal').innerHTML=`<div class="ov" onclick="if(event.target===this){S.after=null;closeM()}"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="m-h"><h2>${title}</h2><button class="iconbtn" onclick="S.after=null;closeM()" aria-label="${T('close')}">${ic('x')}</button></div><div class="m-b">${body}</div>${foot?`<div class="m-f">${foot}</div>`:''}</div></div>`;
 renderQRs($('modal'));const f=$('modal').querySelector('input:not([type=checkbox]),select,textarea');if(f&&window.innerWidth>700)setTimeout(()=>f.focus(),30)}
function closeM(){$('modal').innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if($('modal').innerHTML){S.after=null;closeM()}else if(S.drawer)closeDrawer()});
function chipsHTML(g,opts,sel,multi){return `<div class="chips" role="group">${opts.map(([v,l])=>{const on=multi?(sel||[]).includes(v):sel===v;return `<button type="button" class="chip ${on?'on':''}" aria-pressed="${on}" data-g="${g}" data-v="${esc(v)}" onclick="chip(this,${multi?1:0})">${l}</button>`}).join('')}</div>`}
function chip(el,multi){if(multi)el.classList.toggle('on');else{document.querySelectorAll(`[data-g="${el.dataset.g}"]`).forEach(x=>{x.classList.remove('on');x.setAttribute('aria-pressed','false')});el.classList.add('on')}
 el.setAttribute('aria-pressed',el.classList.contains('on'));const f=CHIPCB[el.dataset.g];f&&f(el.dataset.v)}
function cv(g){const e=document.querySelector(`[data-g="${g}"].on`);return e?e.dataset.v:null}
function cvs(g){return [...document.querySelectorAll(`[data-g="${g}"].on`)].map(e=>e.dataset.v)}

function callCard(c){return `<div class="job"><div class="job-top" ${c.cust&&S.user.t==='admin'?`onclick="go('customer','${c.cust}')"`:''}><span class="av">${initials(c.name)}</span><div><b>${esc(c.name)}</b><small>${fdt(c.at)}</small></div>${outPill(c.out)}</div>

function callDone(id){const c=DB.calls.find(x=>x.id===id);c.done=true;done()}
function bookFromCall(id){const c=DB.calls.find(x=>x.id===id);openBooking({call:id,cust:c.cust,name:c.name,phone:c.phone})}
function openCall(){
 modal(T('newCall'),`<div class="field"><label for="cph">${T('phone')}</label><input id="cph" type="tel" placeholder="+972" oninput="callMatch()"></div>
 <div class="field"><label for="cnm">${T('name')}</label><input id="cnm"></div>
 <div class="field"><label for="cnt">${T('note')}</label><textarea id="cnt"></textarea></div>
 <div class="field"><span class="flabel">${T('result')}</span>${chipsHTML('out',['interested','callback','booked','notNow'].map(o=>[o,T('out_'+o)]),'interested')}</div>`,
 `<button class="btn" onclick="closeM()">${T('cancel')}</button><button class="btn pri" onclick="saveCall()">${ic('check')} ${T('save')}</button>`)}
function callMatch(){const p=$('cph').value.replace(/\D/g,'');if(p.length<6)return;const c=DB.customers.find(x=>x.phone.replace(/\D/g,'').endsWith(p.slice(-7)));if(c&&!$('cnm').value)$('cnm').value=c.name}
function saveCall(){const phone=$('cph').value.trim(),name=$('cnm').value.trim();if(!phone&&!name)return;
 const p=phone.replace(/\D/g,''),cu=p.length>=6?DB.customers.find(x=>x.phone.replace(/\D/g,'').endsWith(p.slice(-7))):null;
 const out=cv('out')||'interested',c={id:'k'+Date.now(),cust:cu?cu.id:null,name:name||(cu&&cu.name)||phone,phone,note:$('cnt').value.trim(),out,at:Date.now(),done:out==='notNow'};
 DB.calls.unshift(c);save();closeM();toast(T('saved'));
 if(out==='booked')openBooking({call:c.id,cust:c.cust,name:c.name,phone:c.phone});else render()}

/* ---------------- booking ---------------- */

 const drivers=DB.staff.filter(s=>s.active&&(R(s.role)||{perms:[]}).perms.includes('pickup'));
 modal(T('newBooking'),`<div class="field"><label for="bcu">${T('customerSel')}</label><select id="bcu" onchange="bkCust()"><option value="new" ${sel==='new'?'selected':''}>${T('newCustomer')}</option>${custs.map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${esc(x.name)}, ${esc(x.phone)}</option>`).join('')}</select></div>
 <div id="bnew" style="display:${sel==='new'?'block':'none'}"><div class="two"><div class="field"><label for="bnm">${T('name')}</label><input id="bnm" value="${esc(pre.name||'')}"></div><div class="field"><label for="bph">${T('phone')}</label><input id="bph" type="tel" value="${esc(pre.phone||'')}"></div></div></div>
 <div class="field"><label for="bfr">${T('pickupAddr')}</label><input id="bfr" value="${esc(c?c.addr:'')}"></div>
 <div class="two"><div class="field"><label for="bdt">${T('pickupDate')}</label><input id="bdt" type="date" value="${dayISO(1)}"></div>
 <div class="field"><label for="bdr">${T('driver')}</label><select id="bdr">${drivers.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select></div></div>
 <h3 style="margin-top:6px">${ic('pin',20)} ${T('receiver')}</h3>
 <div class="two"><div class="field"><label for="brn">${T('name')}</label><input id="brn" value="${esc(rcv.name||'')}"></div><div class="field"><label for="brp">${T('phone')}</label><input id="brp" type="tel" value="${esc(rcv.phone||'+94 ')}"></div></div>
 <div class="field"><label for="bra">${T('slAddr')}</label><input id="bra" value="${esc(rcv.addr||'')}"></div>
 <div class="field"><label for="brc">${T('city')}</label><input id="brc" value="${esc(rcv.city||'')}"></div>
 <div class="field"><span class="flabel">${T('items')}</span>${chipsHTML('it',ITEMS.map(i=>[i,T(i)]),['it_clothes'],true)}<input id="bot" placeholder="${T('otherItems')}" style="margin-top:8px"></div>
 <div class="field"><label for="bkg">${T('estWeight')}</label><input id="bkg" class="in-big" type="number" inputmode="decimal" min="0" value="20" oninput="$('bpr').textContent=ils((parseFloat(this.value)||0)*${DB.settings.rate})"></div>
 <div class="pricebox"><span>${T('price')} (~)</span><b id="bpr">${ils(20*DB.settings.rate)}</b></div>
 <input type="hidden" id="bcall" value="${esc(pre.call||'')}">`,
 `<button class="btn" onclick="closeM()">${T('cancel')}</button><button class="btn pri" onclick="saveBooking()">${ic('check')} ${T('newBooking')}</button>`)}
function bkCust(){const v=$('bcu').value;$('bnew').style.display=v==='new'?'block':'none';if(v!=='new'){const c=C(v);$('bfr').value=c.addr;$('brn').value=c.rcv.name||'';$('brp').value=c.rcv.phone||'';$('bra').value=c.rcv.addr||'';$('brc').value=c.rcv.city||''}}
function saveBooking(){
 let cid=$('bcu').value;const from=$('bfr').value.trim();
 if(cid==='new'){const name=$('bnm').value.trim(),phone=$('bph').value.trim();if(!name||!phone||!from){toast(T('fillAll'),'x');return}
  cid='c'+Date.now();DB.customers.push({id:cid,name,phone,addr:from,pin:'0000',rcv:{}})}
 if(!from){toast(T('fillAll'),'x');return}
 const c=C(cid),to={name:$('brn').value.trim(),phone:$('brp').value.trim(),addr:$('bra').value.trim(),city:$('brc').value.trim()};
 if(!c.addr)c.addr=from;c.rcv={...to};
 const est=parseFloat($('bkg').value)||0,id='JC-'+(++DB.seq);
 const b={id,cust:cid,from,to,items:cvs('it'),other:$('bot').value.trim(),est,weight:null,price:Math.round(est*DB.settings.rate),pays:[],status:'booked',hist:[],pickupDate:$('bdt').value||dayISO(1),drvIL:$('bdr').value||null,drvSL:null,cont:null,eta:null,mode:'home',point:null,addrOk:false,onWay:false,created:Date.now(),deliveredAt:null};
 DB.boxes.push(b);const call=$('bcall').value;if(call){const k=DB.calls.find(x=>x.id===call);if(k){k.done=true;k.out='booked';k.cust=cid}}
 closeM();setStatus(b,'booked');save();go('box',id)}

function vContainers(){
 const order={loading:0,shipped:1,customs:2,arrived:3},ks=[...DB.containers].sort((a,z)=>order[a.status]-order[z.status]||z.created-a.created);

 <div class="jobs">${ks.map(k=>`<div class="job" style="cursor:pointer" onclick="go('container','${k.id}')"><div class="job-top"><span class="av">${ic('container',22)}</span><div><b>${k.id}</b><small>${tf('boxCount',{n:k.boxes.length})}</small></div>${kPill(k)}</div>

}
function ktrack(k){const st=['loading','shipped','customs','arrived'],i=st.indexOf(k.status),ics=['warehouse','ship','shield','pin'];
 return `<div class="track sm">${st.map((s,j)=>{const cls=j<i||k.status==='arrived'?'done':j===i?'cur':'';return `<div class="stop ${cls}"><span class="dot">${ic(cls==='done'?'check':ics[j],15)}</span></div>`}).join('')}</div>`}
function vContainer(id){const k=K(id);if(!k)return backBtn()+`<div class="empty">${T('notFound')}</div>`;
 const bx=k.boxes.map(B).filter(Boolean),a=[];
 if(k.status==='loading'&&can('wh_il')){a.push(`<button class="btn big" onclick="openAddBoxes('${k.id}')">${ic('plus')} ${T('addBoxes')}</button>`);if(bx.length)a.push(`<button class="btn big pri" onclick="openShip('${k.id}')">${ic('ship')} ${T('shipIt')}</button>`)}
 if(k.status==='shipped'&&can('wh_sl'))a.push(`<button class="btn big" onclick="kCustoms('${k.id}')">${ic('shield')} ${T('atCustoms')}</button>`);
 if((k.status==='shipped'||k.status==='customs')&&can('wh_sl'))a.push(`<button class="btn big pri" onclick="kArrive('${k.id}')">${ic('pin')} ${T('kArrive')}</button>`);
 if((k.status==='shipped'||k.status==='customs')&&(can('wh_il')||can('wh_sl')))a.push(`<button class="btn big" onclick="openShip('${k.id}',1)">${ic('calendar')} ${T('changeEta')}</button>`);
 if(can('wh_il')||can('wh_sl'))a.push(`<button class="btn big ghost" onclick="openKLabel('${k.id}')">${ic('print')} ${T('printLabel')}</button>`);
 return `${backBtn()}<div class="bx-head"><div><div class="bx-id">${T('container')}</div><h1>${k.id}</h1></div><div class="pills">${kPill(k)}<span class="pill plain">${tf('boxCount',{n:bx.length})}</span></div></div>
 <section class="card"><div class="track">${['loading','shipped','customs','arrived'].map((s,j)=>{const i=['loading','shipped','customs','arrived'].indexOf(k.status);const cls=j<i||k.status==='arrived'?'done':j===i?'cur':'';return `<div class="stop ${cls}"><span class="dot">${ic(cls==='done'?'check':['warehouse','ship','shield','pin'][j],20)}</span><span class="sl">${T('k_'+s)}</span></div>`}).join('')}</div>
 ${k.eta&&k.status!=='arrived'?`<div class="eta">${ic('ship',30)}<div>${T('eta')}<b>${fd(k.eta)}</b></div></div>`:''}</section>
 ${a.length?`<div class="acts">${a.join('')}</div>`:''}
 <section class="card" style="padding:8px"><div class="rows">${bx.length?bx.map(boxRow).join(''):`<div class="empty">${ic('box',34)}<p>${T('noBoxesHere')}</p></div>`}</div></section>`}
function openAddBoxes(kid){const loose=DB.boxes.filter(b=>b.status==='il_wh'&&!b.cont);
 modal(T('addBoxes'),loose.length?`<div>${loose.map(b=>`<label class="check"><input type="checkbox" value="${b.id}" checked class="lb"><span><b>${b.id}</b> ${esc(C(b.cust).name)}, ${b.weight||b.est} kg</span></label>`).join('')}</div>`:`<p class="note">${T('noLoose')}</p>`,
 loose.length?`<button class="btn" onclick="closeM()">${T('cancel')}</button><button class="btn pri" onclick="saveAddBoxes('${kid}')">${ic('check')} ${T('addBoxes')}</button>`:`<button class="btn" onclick="closeM()">${T('close')}</button>`)}
function saveAddBoxes(kid){const k=K(kid);document.querySelectorAll('.lb:checked').forEach(e=>{const b=B(e.value);if(b&&!b.cont){b.cont=kid;k.boxes.push(b.id);b.hist.push({st:'load',at:Date.now(),by:myName(),note:kid})}});closeM();done()}
function openShip(kid,change){const k=K(kid);
 modal(change?T('changeEta'):T('shipIt'),`<div class="field"><label for="keta">${T('setEta')}</label><input id="keta" type="date" value="${k.eta||dayISO(18)}"></div><p class="note">${tf('waSentN',{n:k.boxes.length})}</p>`,
 `<button class="btn" onclick="closeM()">${T('cancel')}</button><button class="btn pri" onclick="saveShip('${kid}',${change?1:0})">${ic(change?'check':'ship')} ${change?T('save'):T('shipIt')}</button>`)}
function saveShip(kid,change){const k=K(kid),eta=$('keta').value;if(!eta)return;k.eta=eta;const bx=k.boxes.map(B).filter(Boolean);
 if(change){bx.forEach(b=>{if(b.status==='delivered')return;b.eta=eta;b.hist.push({st:'eta',at:Date.now(),by:myName(),note:fd(eta)});notify(b,'n_eta',{id:b.id,eta:fd(eta)},true)})}
 else{k.status='shipped';k.shipDate=dayISO(0);bx.forEach(b=>{b.eta=eta;setStatus(b,'shipped',true)})}
 closeM();toast(tf('waSentN',{n:bx.length}),'msg');done()}
function kCustoms(kid){const k=K(kid);k.status='customs';const bx=k.boxes.map(B).filter(b=>b&&sIdx(b.status)<sIdx('customs'));bx.forEach(b=>setStatus(b,'customs',true));toast(tf('waSentN',{n:bx.length}),'msg');done()}
function kArrive(kid){const k=K(kid);k.status='arrived';const bx=k.boxes.map(B).filter(b=>b&&sIdx(b.status)<sIdx('sl_wh'));bx.forEach(b=>setStatus(b,'sl_wh',true));toast(tf('waSentN',{n:bx.length}),'msg');done()}

function jobCard(b,kind){const c=C(b.cust),il=kind==='pickup',addr=il?b.from:b.to.addr,ph=il?c.phone:b.to.phone,nm=il?c.name:b.to.name;
 let main='';
 if(kind==='pickup')main=`${!b.onWay?`<button class="btn" onclick="actOnWay('${b.id}')">${ic('truck',20)} ${T('actOnWay')}</button>`:''}<button class="btn pri" onclick="openWeigh('${b.id}')">${ic('check')} ${T('actPicked')}</button>`;
 if(kind==='checkin')main=`<button class="btn pri" onclick="actCheckIn('${b.id}')">${ic('warehouse')} ${T('actWh')}</button>`;
 if(kind==='load')main=`<button class="btn pri" onclick="openLoad('${b.id}')">${ic('container')} ${T('actContainer')}</button>`;
 if(kind==='sl')main=b.addrOk?`<button class="btn pri" onclick="openSendOut('${b.id}')">${ic('truck')} ${b.mode==='point'?T('actReady'):T('actOut')}</button>`:`<button class="btn pri" onclick="openAddr('${b.id}')">${ic('map')} ${T('confirmAddress')}</button>`;
 if(kind==='deliver')main=`<button class="btn lime" onclick="openDeliver('${b.id}')">${ic('checkc')} ${T('actDelivered')}</button>`;
 const when=kind==='pickup'?`<span class="pill ${b.pickupDate===dayISO(0)?'z3':'plain'}">${dayWord(b.pickupDate)}</span>`:stagePill(b);
 return `<div class="job"><div class="job-top" onclick="go('box','${b.id}')"><span class="av">${initials(nm)}</span><div><b>${esc(nm)}</b><small><span class="tag">${b.id}</span>${b.weight||b.est} kg</small></div>${when}</div>
 <div class="job-addr">${ic('pin',20)}<span>${esc(addr)}</span></div>${bal(b)&&can('cash')?`<div class="job-addr" style="color:var(--red)">${ic('wallet',20)}<span>${T('balance')}: ${ils(bal(b))}</span></div>`:''}
 <div class="job-btns"><a class="btn sm" href="${telHref(ph)}">${ic('phone',18)} ${T('call')}</a><a class="btn sm" href="${mapHref(addr)}" target="_blank" rel="noopener">${ic('map',18)} ${T('map')}</a>${main}</div></div>`}

/* ---------------- driver runs ---------------- */
function isDriver(){if(!S.user||S.user.t!=='staff')return false;return (can('pickup')||can('deliver'))&&!can('wh_il')&&!can('wh_sl')&&!can('calls')}
function drvPerms(sid){const s=ST(sid);return ((s&&R(s.role))||{perms:[]}).perms}
function runFor(sid){const p=drvPerms(sid);return DB.boxes.filter(b=>(p.includes('pickup')&&b.status==='booked'&&b.drvIL===sid)||(p.includes('deliver')&&b.status==='out'&&b.drvSL===sid))
 .sort((a,z)=>((a.runIdx??1e6)-(z.runIdx??1e6))||String(a.pickupDate).localeCompare(String(z.pickupDate)))}
function stopInfo(b){const c=C(b.cust),pk=b.status==='booked';return {pk,nm:pk?c.name:b.to.name,ph:pk?c.phone:b.to.phone,addr:pk?b.from:b.to.addr}}
function dirHref(a){return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(a||'')}
function runNorm(sid){runFor(sid).forEach((b,i)=>b.runIdx=i)}
function runMove(id,d,sid){runNorm(sid);const l=runFor(sid),i=l.findIndex(b=>b.id===id),j=i+d;if(j<0||j>=l.length)return;const t=l[i].runIdx;l[i].runIdx=l[j].runIdx;l[j].runIdx=t;done()}
function runRemove(id,sid){const b=B(id);if(b.status==='booked')b.drvIL=null;else b.drvSL=null;b.runIdx=null;runNorm(sid);done()}
function runEligible(sid){const p=drvPerms(sid);return DB.boxes.filter(b=>(p.includes('pickup')&&b.status==='booked'&&b.drvIL!==sid)||(p.includes('deliver')&&((b.status==='out'&&b.drvSL!==sid)||(b.status==='sl_wh'&&b.mode!=='point'))))}
function openRunAdd(sid){const l=runEligible(sid),d=ST(sid);
 modal(tf('addStops',{})+' · '+esc(d.name),l.length?l.map(b=>{const x=stopInfo(b),o=b.status==='booked'?b.drvIL:b.drvSL,on=o&&ST(o);
  return `<label class="check"><input type="checkbox" value="${b.id}" class="radd"><span><b>${esc(x.nm)}</b> <span class="tag">${b.id}</span><br><small class="muted">${esc(x.addr)}${b.status==='sl_wh'?' · '+T('readyOut'):''}${on?' · '+tf('withDrv',{n:esc(on.name.split(' ')[0])}):''}</small></span></label>`}).join(''):`<div class="empty">${T('noEligible')}</div>`,
 `<button class="btn" onclick="closeM()">${T('cancel')}</button>${l.length?`<button class="btn pri" onclick="saveRunAdd('${sid}')">${ic('plus',20)} ${T('addStops')}</button>`:''}`)}
function saveRunAdd(sid){const ids=[...document.querySelectorAll('.radd:checked')].map(i=>i.value);if(!ids.length){closeM();return}
 runNorm(sid);let n=runFor(sid).length;
 ids.forEach(id=>{const b=B(id);if(b.status==='booked')b.drvIL=sid;else{b.drvSL=sid;if(b.status==='sl_wh'){b.addrOk=true;setStatus(b,'out')}}b.runIdx=n++});
 closeM();toast(T('addedRun'));done()}
function vRuns(){const ds=DB.staff.filter(s=>s.active&&(drvPerms(s.id).includes('pickup')||drvPerms(s.id).includes('deliver')));
 return `<div class="hello"><div><h1>${T('runs')}</h1><p class="muted">${T('runIntro')}</p></div></div><div class="grid g2">${ds.map(d=>{const l=runFor(d.id);

 ${l.length?`<ol class="run-list">${l.map((b,i)=>{const x=stopInfo(b);return `<li class="run-row"><span class="run-n">${i+1}</span><button class="r-main lnk-row" onclick="go('box','${b.id}')"><b>${esc(x.nm)}</b><small><span class="tag">${b.id}</span>${esc(x.addr)}</small></button>
 <span class="run-ctl"><button class="iconbtn sm" aria-label="${T('moveUp')}" ${i?'':'disabled'} onclick="runMove('${b.id}',-1,'${d.id}')">${ic('up',18)}</button><button class="iconbtn sm" aria-label="${T('moveDown')}" ${i<l.length-1?'':'disabled'} onclick="runMove('${b.id}',1,'${d.id}')">${ic('down',18)}</button><button class="iconbtn sm" aria-label="${T('removeStop')}" onclick="runRemove('${b.id}','${d.id}')">${ic('x',18)}</button></span></li>`}).join('')}</ol>`:`<div class="empty">${T('runEmpty')}</div>`}
 <button class="btn sm run-add" onclick="openRunAdd('${d.id}')">${ic('plus',18)} ${T('addStops')}</button></section>`}).join('')}</div>`}
function mapSVG(run,seed){
 const xs=[40,160,280,400,520],ys=[95,195,295,395];
 const h=[...String(seed)].reduce((a,c)=>a*31+c.charCodeAt(0)>>>0,7);
 const sx=xs[1+(h%2)],sy=ys[2],dx=xs[3+((h>>>2)%2)],dy=ys[0],my=ys[1],mx=xs[2];
 let blocks='';for(let i=0;i<4;i++)for(let j=-1;j<3;j++){const x=xs[i]+10,y=j<0?-10:ys[j]+10,w=100,hh=j<0?95:80;const park=(i===1&&j===0)||(i===3&&j===2);
  blocks+=`<rect x="${x}" y="${y}" width="${w}" height="${hh}" rx="10" fill="var(${park?'--map-park':'--map-block'})"/>`;
  if(!park)blocks+=`<rect x="${x+12}" y="${y+12}" width="${w/2-18}" height="${hh/2-18}" rx="4" fill="var(--map-bg)" opacity=".5"/><rect x="${x+w/2+6}" y="${y+hh/2+6}" width="${w/2-18}" height="${hh/2-18}" rx="4" fill="var(--map-bg)" opacity=".5"/>`}
 const roads=xs.map(x=>`<line x1="${x}" y1="0" x2="${x}" y2="430" stroke="var(--map-road)" stroke-width="${x===mx?16:10}"/>`).join('')+ys.map(y=>`<line x1="0" y1="${y}" x2="600" y2="${y}" stroke="var(--map-road)" stroke-width="${y===my?16:10}"/>`).join('');
 const route=`M${sx} ${sy} V${my} H${dx} V${dy}`;
 const others=run.slice(1,4).map((b,i)=>{const px=xs[[4,0,3][i]],py=ys[[2,0,3][i]];return `<g transform="translate(${px} ${py})"><circle r="13" fill="var(--surface)" stroke="var(--ink)" stroke-width="2.5"/><text y="5" text-anchor="middle" font-size="14" font-weight="800" fill="var(--ink)" font-family="Figtree,sans-serif">${i+2}</text></g>`}).join('');
 return `<svg viewBox="0 0 600 430" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${T('nextStop')}">
 <rect width="600" height="430" fill="var(--map-bg)"/><path d="M560 0 Q520 120 600 220 V0z" fill="var(--map-water)"/>${roads}${blocks}
 <path d="${route}" fill="none" stroke="var(--surface)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
 <path d="${route}" fill="none" stroke="var(--route)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
 <path class="route-flow" d="${route}" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round" stroke-linejoin="round"/>
 ${others}
 <g transform="translate(${dx} ${dy})"><path d="M0 0 C-14 -16 -20 -26 -20 -36 A20 20 0 1 1 20 -36 C20 -26 14 -16 0 0z" fill="#D8A24C" stroke="#10243E" stroke-width="3"/><text y="-30" text-anchor="middle" font-size="18" font-weight="800" fill="#10243E" font-family="Figtree,sans-serif">1</text></g>
 <g transform="translate(${sx} ${sy})"><circle class="me-pulse" r="22" fill="var(--route)" opacity=".25"/><circle r="13" fill="var(--route)" stroke="#FFFFFF" stroke-width="4"/><path d="M0 -7 L5 4 L0 1 L-5 4z" fill="#FFFFFF"/></g></svg>`}

 const hi=`<div class="hello"><div><h1>${tf('hello',{n:esc(me.name.split(' ')[0])})}</h1><p><span class="pill z1">${esc(roleName(R(me.role)))}</span> <span class="muted small">${tf('stopsN',{n:run.length})}</span></p></div><button class="btn" onclick="go('scan')">${ic('scan',20)} ${T('scan')}</button></div>`;

 return hi+`<div class="drv">

  <div class="drv-call"><span>${ic('phone',20)}<b>${esc(x.ph)}</b></span><a class="btn sm" href="${telHref(x.ph)}">${T('call')}</a></div>
  <div class="drv-acts">${main}</div>
 </section></div>
 ${run.length>1?`<div class="sec-h"><h2>${T('upNext')}</h2><span class="count">${run.length-1}</span></div><section class="card" style="padding:8px"><div class="rows">${run.slice(1).map((n,i)=>{const y=stopInfo(n);return `<button class="row" onclick="go('box','${n.id}')"><span class="run-n">${i+2}</span><span class="r-main"><b>${esc(y.nm)}</b><small>${esc(y.addr)}</small></span><span class="r-pills"><span class="pill ${y.pk?'z1':'z3'}">${y.pk?T('pickupStop'):T('dropStop')}</span></span>${ic('right',18)}</button>`}).join('')}</div></section>`:''}`}

/* ---------------- scan ---------------- */
let CAM={stream:null,raf:null};
function vScan(){const demo=[...DB.boxes.filter(b=>b.status!=='delivered').slice(-6).map(b=>b.id),...DB.containers.filter(k=>k.status!=='arrived').map(k=>k.id)];
 return `${S.user.t==='admin'?backBtn():''}<div class="hello"><h1>${T('scan')}</h1></div><div class="grid g2">
 <section class="card"><div class="cam"><video id="vid" playsinline muted></video><div class="cam-frame"></div><div id="camMsg" class="cam-msg">${ic('camera',38)}<span>${T('scanHint')}</span></div></div>
 <button class="btn pri big" id="camBtn" onclick="CAM.stream?stopCam(1):startCam()">${ic('camera')} ${T('startCamera')}</button></section>
 <section class="card"><div class="field"><label for="scanId">${T('typeId')}</label><div class="row-in"><input id="scanId" placeholder="JC-1050" autocapitalize="characters" onkeydown="if(event.key==='Enter')findId()"><button class="btn pri" onclick="findId()">${T('find')}</button></div></div>
 <p class="flabel" style="margin:6px 0 10px">${T('tryDemo')}</p><div class="chips">${demo.map(i=>`<button class="chip" onclick="handleCode('${i}')">${ic(i.startsWith('CN')?'container':'qr',18)} ${i}</button>`).join('')}</div></section></div>`}
async function startCam(){const msg=$('camMsg');
 try{if(!navigator.mediaDevices||!window.jsQR)throw 0;
  CAM.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=$('vid');v.srcObject=CAM.stream;await v.play();
  msg.style.display='none';$('camBtn').innerHTML=ic('x')+' '+T('stopCamera');
  const cv=document.createElement('canvas'),ctx=cv.getContext('2d',{willReadFrequently:true});
  const tick=()=>{if(!CAM.stream)return;if(v.readyState===v.HAVE_ENOUGH_DATA){cv.width=v.videoWidth;cv.height=v.videoHeight;ctx.drawImage(v,0,0);const img=ctx.getImageData(0,0,cv.width,cv.height);const code=jsQR(img.data,img.width,img.height,{inversionAttempts:'dontInvert'});if(code&&code.data){const t=code.data.trim().toUpperCase();if(B(t)||K(t)){if(navigator.vibrate)navigator.vibrate(80);handleCode(t);return}if(CAM.last!==t){CAM.last=t;toast(T('notFound'),'x')}}}CAM.raf=requestAnimationFrame(tick)};tick();
 }catch(e){stopCam();if(msg){msg.style.display='flex';msg.innerHTML=ic('camera',38)+'<span>'+T('camFail')+'</span>'}}}
function stopCam(re){if(CAM.raf)cancelAnimationFrame(CAM.raf);CAM.raf=null;if(CAM.stream){CAM.stream.getTracks().forEach(t=>t.stop());CAM.stream=null}if(re===1&&S.page==='scan')render()}
function findId(){let v=$('scanId').value.trim().toUpperCase();if(/^\d+$/.test(v))v='JC-'+v;handleCode(v)}
function handleCode(t){t=String(t).trim().toUpperCase();if(B(t)){go('box',t);return}if(K(t)){go('container',t);return}toast(T('notFound'),'x')}

 ${track(b,1)}<p class="say">${esc(sentence(b))}</p>${etaBlock(b)}

 return `<div class="hello"><h1>${tf('hello',{n:esc(c.name.split(' ')[0])})}</h1><button class="btn pri" onclick="go('send')">${ic('plus',20)} ${T('sendBox')}</button></div>
 ${act.length?act.map(cBoxCard).join(''):`<section class="card empty">${ic('box',40)}<p>${T('noMine')}</p><button class="btn pri" onclick="go('send')">${T('sendBox')}</button></section>`}
 ${dn.length?`<div class="sec-h"><h2>${T('delivered')}</h2><span class="count">${dn.length}</span></div><section class="card" style="padding:8px"><div class="rows">${dn.map(b=>`<button class="row" onclick="go('box','${b.id}')"><span class="av">${ic('checkc',20)}</span><span class="r-main"><b>${esc(tf('toWho',{n:b.to.name,c:b.to.city}))}</b><small><span class="tag">${b.id}</span>${fd(b.deliveredAt)}</small></span><span></span>${ic('right',20)}</button>`).join('')}</div></section>`:''}`}
function vCBox(id){const b=B(id);if(!b||b.cust!==S.user.id)return backBtn()+`<div class="empty">${T('notFound')}</div>`;
 return `${backBtn()}<div class="bx-head"><div><div class="bx-id">${b.id}</div><h1>${esc(tf('toWho',{n:b.to.name,c:b.to.city}))}</h1></div><div class="pills">${stagePill(b)}${payPill(b)}</div></div>
 <section class="card">${track(b)}<p class="say">${esc(sentence(b))}</p>${etaBlock(b)}</section>
 <div class="acts">${b.status==='sl_wh'?`<button class="btn big ${b.addrOk?'':'lime'}" onclick="openAddr('${b.id}')">${ic('map')} ${b.addrOk?T('changeDelivery'):T('chooseDelivery')}</button>`:''}${bal(b)?`<button class="btn pri big" onclick="openCPay('${b.id}')">${ic('card')} ${T('payNow')} ${ils(bal(b))}</button>`:''}<a class="btn big" href="${telHref('+972 3 555 0199')}">${ic('phone')} ${T('callUs')}</a></div>
 <div class="grid g2"><section class="card"><h3><span class="chipic">${ic('pin',18)}</span>${T('receiver')}</h3>${kv(T('name'),esc(b.to.name))}${kv(T('phone'),esc(b.to.phone))}${kv(T('address'),esc(b.to.addr))}${kv(T('delivery'),b.mode==='point'?esc(b.point||T('pickupPoint')):T('homeDelivery'))}</section>
 <section class="card"><h3><span class="chipic">${ic('box',18)}</span>${T('theBox')}</h3>${kv(T('weight'),b.weight?b.weight+' kg':'~'+b.est+' kg')}${kv(T('price'),ils(b.price))}${kv(T('paid'),ils(paidOf(b)))}${kv(T('balance'),ils(bal(b)))}</section></div>
 <section class="card"><h3><span class="chipic">${ic('clock',18)}</span>${T('history')}</h3><ol class="hist">${[...b.hist].reverse().filter(h=>h.st!=='load').map(h=>`<li><div><b>${histLabel(h)}${h.st==='pay'&&h.note?': '+esc(h.note):''}</b><small>${fdt(h.at)}</small></div></li>`).join('')}</ol></section>`}
function openCPay(id){const b=B(id),due=bal(b);
 modal(T('payTitle'),`<div class="pricebox"><span>${b.id}</span><b>${ils(due)}</b></div>
 <div class="field"><label for="ccn">${T('cardNo')}</label><input id="ccn" inputmode="numeric" value="4242 4242 4242 4242"></div>
 <div class="two"><div class="field"><label for="cce">${T('expiry')}</label><input id="cce" value="12/28"></div><div class="field"><label for="ccc">${T('cvc')}</label><input id="ccc" inputmode="numeric" value="123"></div></div>
 <p class="note">${T('payDemo')}</p>`,
 `<button class="btn" onclick="closeM()">${T('cancel')}</button><button class="btn pri" id="cpb" onclick="doCPay('${id}',${due})">${ic('card')} ${T('payTitle')} ${ils(due)}</button>`)}
function doCPay(id,due){const btn=$('cpb');btn.disabled=true;btn.textContent=T('paying');
 setTimeout(()=>{const b=B(id);b.pays.push({amt:due,cur:'ILS',method:'online',at:Date.now(),by:C(b.cust).name});b.hist.push({st:'pay',at:Date.now(),by:C(b.cust).name,note:ils(due)});notify(b,'n_paid',{id:b.id,amt:ils(due)},true);save();
  modal(T('payTitle'),`<div class="done-ok"><div class="chipic">${ic('check',36)}</div><h2 style="justify-content:center">${T('payDone')}</h2><p class="muted">${ils(due)}</p></div>`,`<button class="btn pri" onclick="closeM();render()">${T('close')}</button>`)},900)}
function vCSend(){const c=C(S.user.id);
 return `<div class="hello"><h1>${T('sendBox')}</h1></div><div class="grid g2"><section class="card">
 <div class="field"><label for="rqa">${T('pickupAddr')}</label><input id="rqa" value="${esc(c.addr)}"></div>
 <div class="field"><label for="rqd">${T('whenPickup')}</label><input id="rqd" type="date" value="${dayISO(2)}"></div>
 <div class="field"><label for="rqk">${T('estWeight')}</label><input id="rqk" class="in-big" type="number" inputmode="decimal" value="20" oninput="$('rqp').textContent=ils((parseFloat(this.value)||0)*${DB.settings.rate})"></div>
 <div class="pricebox"><span>${T('price')} (~)</span><b id="rqp">${ils(20*DB.settings.rate)}</b></div>
 <div class="field"><label for="rqn">${T('note')}</label><textarea id="rqn"></textarea></div>
 <button class="btn pri big" onclick="sendRequest()">${ic('truck')} ${T('requestPickup')}</button></section>
 <section class="card"><a class="btn big" href="${telHref('+972 3 555 0199')}">${ic('phone')} ${T('callUs')}</a></section></div>`}
function sendRequest(){const c=C(S.user.id),kg=$('rqk').value,d=$('rqd').value;
 DB.calls.unshift({id:'k'+Date.now(),cust:c.id,name:c.name,phone:c.phone,note:`${kg} kg, ${fd(d)}. ${$('rqa').value.trim()}. ${$('rqn').value.trim()}`.trim(),out:'request',at:Date.now(),done:false});save();
 $('main').innerHTML=`<section class="card done-ok" style="margin-top:20px"><div class="chipic">${ic('check',36)}</div><h2 style="justify-content:center">${T('requestSent')}</h2><p><button class="btn pri" style="margin-top:14px" onclick="go('home')">${T('myBoxes')}</button></p></section>`}
function vCMsgs(){const m=DB.msgs.filter(x=>x.cust===S.user.id);return `<div class="hello"><h1>${T('messages')}</h1></div><div class="bubbles">${m.length?m.map(x=>bubble(x)).join(''):`<div class="empty">${T('noMine')}</div>`}</div>`}


/* swipe + drag for horizontal rows (touch swipes natively; mouse can drag or use the wheel) */
function initSwipe(){document.querySelectorAll('.nav,.chips.scroll').forEach(el=>{if(el.dataset.sw)return;el.dataset.sw=1;
 let down=false,sx=0,sl=0,moved=false;
 const edge=()=>{const max=el.scrollWidth-el.clientWidth;el.classList.toggle('at-end',el.scrollLeft>=max-2);el.classList.toggle('mid',el.scrollLeft>2)};
 el.addEventListener('scroll',edge,{passive:true});edge();
 el.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;down=true;moved=false;sx=e.clientX;sl=el.scrollLeft});
 window.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-sx;if(Math.abs(dx)>5){moved=true;el.classList.add('drag')}el.scrollLeft=sl-dx});
 window.addEventListener('pointerup',()=>{down=false;el.classList.remove('drag')});
 el.addEventListener('click',e=>{if(moved){e.preventDefault();e.stopPropagation();moved=false}},true);
 el.addEventListener('wheel',e=>{if(el.scrollWidth<=el.clientWidth||Math.abs(e.deltaX)>Math.abs(e.deltaY))return;e.preventDefault();el.scrollLeft+=e.deltaY},{passive:false});
 const on=el.querySelector('.on');if(on&&on.offsetLeft+on.offsetWidth>el.clientWidth)el.scrollLeft=on.offsetLeft-el.clientWidth/2+on.offsetWidth/2;edge();
});}
/* ---------------- start ---------------- */
load();
if(S.user&&((S.user.t==='staff'&&!ST(S.user.id))||(S.user.t==='customer'&&!DB.customers.find(c=>c.id===S.user.id))))S.user=null;
hReset();
render();
</script>
