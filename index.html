<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Janath Cargo</title>
<meta name="theme-color" content="#0E5566">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Janath Cargo">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Door to door cargo from Israel to Sri Lanka and the Philippines. Demo portal.">
<meta property="og:title" content="Janath Cargo">
<meta property="og:description" content="Door to door cargo from Israel. Demo portal.">
<meta property="og:type" content="website">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Noto+Sans+Sinhala:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
:root{
 --bg:#EDF0F0;--surface:#FFFFFF;--surface-2:#F4F6F6;--ink:#102A31;--muted:#566B70;--line:#D8DEDF;
 --primary:#0E4F5E;--ptext:#0E4F5E;--soft:#D3E4E8;--lime:#D4EE5E;--lime-ink:#26300A;--hdr:#0E4F5E;
 --z1b:#DCEBEF;--z1t:#0E4F5E;--z2b:#F8E9CC;--z2t:#7A4F08;--z3b:#EAF5C4;--z3t:#3F4D0A;--z4b:#D9EEE0;--z4t:#1C6440;
 --red:#B0352C;--redb:#F6E1DE;--focus:#1B6F80;--ov:rgba(8,26,31,.55);--r:12px;
 color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0B1B1F;--surface:#11252A;--surface-2:#162E34;--ink:#E3ECEE;--muted:#93A9AE;--line:#25414A;
 --primary:#1E7488;--ptext:#8CCEDC;--soft:#1F4751;--hdr:#0D2126;
 --z1b:#173F49;--z1t:#9FD6E3;--z2b:#3D2F12;--z2t:#F2C978;--z3b:#33401A;--z3t:#D4EE5E;--z4b:#173C2A;--z4t:#8ED9AE;
 --red:#F08A80;--redb:#45201D;--focus:#D4EE5E;--ov:rgba(0,0,0,.6);color-scheme:dark;}}
:root[data-theme="dark"]{
 --bg:#0B1B1F;--surface:#11252A;--surface-2:#162E34;--ink:#E3ECEE;--muted:#93A9AE;--line:#25414A;
 --primary:#1E7488;--ptext:#8CCEDC;--soft:#1F4751;--hdr:#0D2126;
 --z1b:#173F49;--z1t:#9FD6E3;--z2b:#3D2F12;--z2t:#F2C978;--z3b:#33401A;--z3t:#D4EE5E;--z4b:#173C2A;--z4t:#8ED9AE;
 --red:#F08A80;--redb:#45201D;--focus:#D4EE5E;--ov:rgba(0,0,0,.6);color-scheme:dark;}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:'Archivo','Noto Sans Sinhala',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
button,a,.chip,.row{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
a{color:var(--ptext)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1{font-size:26px;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:17px;margin:0;font-weight:700;display:flex;align-items:center;gap:10px}
h3{font-size:16px;margin:0 0 10px;font-weight:700;display:flex;align-items:center;gap:10px}
.muted{color:var(--muted)}.small{font-size:15px}
.ic{flex:none}
.card-h .chipic,h3 .chipic{display:none}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hdr);color:#fff}
.top-in{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:0 24px;min-height:66px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;font-weight:800;font-size:19px;white-space:nowrap}
.rbadge{font-size:13px;font-weight:700;padding:5px 9px;border-radius:6px;background:rgba(255,255,255,.1);color:#E8F3F5;white-space:nowrap;border:1px solid rgba(255,255,255,.16)}
.rbadge .rb-s{display:none}
.nav{display:flex;align-self:stretch;flex-wrap:nowrap;overflow:auto}
.nav a{display:flex;align-items:center;gap:8px;padding:0 11px;color:rgba(255,255,255,.72);text-decoration:none;font-weight:600;white-space:nowrap;font-size:16px;box-shadow:inset 0 -3px 0 transparent}
.nav a:hover{color:#fff}
.nav a.on{color:#fff;box-shadow:inset 0 -3px 0 var(--lime)}
.tools{margin-left:auto;display:flex;gap:8px;align-items:center}
.iconbtn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.langbtn{height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;cursor:pointer;white-space:nowrap}
.who{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px 0 5px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.top .iconbtn,.top .langbtn,.top .who{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#fff}
.top .who .av{background:var(--lime);color:var(--lime-ink)}
.av{width:42px;height:42px;border-radius:50%;background:var(--soft);color:var(--ptext);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.av.sm{width:34px;height:34px;font-size:13px}
main{max-width:1280px;margin:0 auto;padding:24px 24px 120px}
.bnav{display:none}
.menubtn{display:none}
@media (max-width:1300px){.nav{display:none}.menubtn{display:grid}}
@media (max-width:900px){
 .t-hide{display:none}
 .top-in{padding:0 14px;gap:10px;min-height:60px}
 .rbadge .rb-l{display:none}.rbadge .rb-s{display:inline}
 main{padding:16px 14px calc(110px + env(safe-area-inset-bottom,0px))}
 .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:0 4px env(safe-area-inset-bottom,0px)}
 .bnav a{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:62px;text-decoration:none;color:var(--muted);font-size:12.5px;font-weight:700;text-align:center;line-height:1.15}
 .bnav a.on{color:var(--ink)}
 .bnav a.on::before{content:'';position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--primary);border-radius:0 0 3px 3px}
 .bnav a.on .ic{color:var(--ptext)}
 h1{font-size:23px}
}

/* layout */
.grid{display:grid;gap:14px;margin-bottom:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
@media (max-width:1050px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g21{grid-template-columns:1fr}}
@media (max-width:760px){.g3,.g2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
section.card{margin-bottom:14px}
.grid>section.card{margin-bottom:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-18px -18px 12px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:54px}
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.hello p{margin:4px 0 0}
.hello-act{display:flex;gap:10px;flex-wrap:wrap}
.chipic{width:40px;height:40px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--ptext);flex:none;font-weight:800}

/* stat strip */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:0;overflow:hidden}
.cell{display:flex;flex-direction:column;gap:6px;padding:18px 20px;background:none;border:0;border-left:1px solid var(--line);text-align:left;cursor:pointer}
.cell:first-child{border-left:0}
.cell:hover{background:var(--surface-2)}
.cell small{color:var(--muted);font-size:15px;font-weight:600}
.cell b{font-size:38px;font-weight:800;line-height:1;letter-spacing:-.02em}
.cell.hot b{color:var(--ptext)}
@media (max-width:760px){.strip{grid-template-columns:1fr 1fr}.cell:nth-child(3){border-left:0}.cell:nth-child(n+3){border-top:1px solid var(--line)}.cell b{font-size:32px}}

/* buttons */
.btn{min-height:50px;padding:0 20px;border-radius:10px;font-weight:700;font-size:16.5px;display:inline-flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;background:var(--surface);color:var(--ink);text-decoration:none;border:1px solid var(--line);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.lime{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.btn.ghost{background:transparent}
.btn.bad{background:var(--redb);color:var(--red);border-color:transparent}
.btn.big{min-height:58px;font-size:17.5px;width:100%;white-space:normal;text-align:center}
.btn.sm{min-height:42px;padding:0 14px;font-size:15px}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.55;cursor:default}
.lnk{background:none;border:0;color:var(--ptext);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:8px 0;font-size:15.5px}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:14px}

/* stats used on payments page */
.stat{display:flex;flex-direction:column;gap:10px;text-align:left}
.st-l{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--muted);font-size:15px}
.st-l .chipic{width:32px;height:32px;font-size:14px}
.st-n{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:6px;font-size:13.5px;font-weight:700;white-space:nowrap;line-height:1.3}
.pill.z1{background:var(--z1b);color:var(--z1t)}.pill.z2{background:var(--z2b);color:var(--z2t)}.pill.z3{background:var(--z3b);color:var(--z3t)}.pill.z4{background:var(--z4b);color:var(--z4t)}
.pill.ok{background:var(--z4b);color:var(--z4t)}.pill.warn{background:var(--z2b);color:var(--z2t)}.pill.bad{background:var(--redb);color:var(--red)}
.pill.plain{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.tag{display:inline-block;padding:0 6px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);font-weight:700;font-size:13px;color:var(--ink);margin-right:6px;letter-spacing:.02em}

/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));row-gap:14px;align-items:start}
.band{grid-row:1;grid-column:var(--c);font-weight:700;font-size:13px;padding:6px 10px;margin:0 3px;border-top:3px solid;text-transform:uppercase;letter-spacing:.05em}
.band.b-il{color:var(--z1t);border-color:var(--primary)}.band.b-sea{color:var(--z2t);border-color:#D9A13B}.band.b-sl{color:var(--z3t);border-color:#9BB82E}
.pstop{grid-row:2;grid-column:var(--c);display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;cursor:pointer;position:relative;padding:4px 2px;border-radius:10px;text-align:center}
.pstop:hover{background:var(--surface-2)}
.pstop::before{content:'';position:absolute;top:31px;right:50%;width:100%;height:2px;background:var(--line)}
.pstop:first-of-type::before{display:none}
.pdot{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);position:relative;z-index:1;color:var(--muted)}
.pdot b{position:absolute;top:-6px;right:-10px;min-width:28px;height:26px;padding:0 7px;border-radius:7px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:14px}
.pstop.has .pdot{border-color:var(--primary);color:var(--ptext)}
.pstop.zero .pdot b{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pstop.hot .pdot{background:var(--lime);border-color:#B5D23E;color:var(--lime-ink)}
.pl{font-weight:600;font-size:14px;line-height:1.25;max-width:110px}
@media (max-width:760px){
 .pipe{grid-template-columns:1fr 1fr;gap:8px}
 .band{display:none}
 .pstop{grid-column:auto;grid-row:auto;flex-direction:row;justify-content:flex-start;text-align:left;border:1px solid var(--line);padding:10px;gap:12px}
 .pstop::before{display:none}
 .pdot{width:42px;height:42px}
 .pdot b{top:-6px;right:-8px;min-width:24px;height:22px;font-size:12.5px}
}

/* journey track */
.track{display:flex;align-items:flex-start}
.stop{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;text-align:center;min-width:0}
.stop::before{content:'';position:absolute;top:21px;right:50%;width:100%;height:3px;background:var(--line)}
.stop:first-child::before{display:none}
.stop.done::before,.stop.cur::before{background:var(--primary)}
.dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--muted);position:relative;z-index:1;border:2px solid var(--line)}
.stop.done .dot{background:var(--primary);border-color:var(--primary);color:#fff}
.stop.cur .dot{background:var(--lime);border-color:#B5D23E;color:var(--lime-ink);box-shadow:0 0 0 5px rgba(212,238,94,.35)}
.sl{font-size:13px;font-weight:600;color:var(--muted);margin-top:8px;padding:0 2px;line-height:1.2}
.stop.cur .sl,.stop.done .sl{color:var(--ink)}
.stop.cur .sl{font-weight:800}
.track.sm .stop::before{top:14px;height:2px}
.track.sm .dot{width:30px;height:30px;border-width:1.5px}
.track.sm .stop.cur .dot{box-shadow:0 0 0 4px rgba(212,238,94,.35)}
.track.sm .sl{display:none}
@media (max-width:640px){.track .sl{display:none}.track:not(.sm) .dot{width:34px;height:34px}.track:not(.sm) .stop::before{top:16px}}
.say{font-size:21px;font-weight:700;margin:20px 0 0;line-height:1.3}
.eta{display:flex;align-items:center;gap:14px;margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--z2b);color:var(--z2t);font-weight:600}
.eta b{font-size:22px;display:block;color:var(--ink)}

/* rows / tables */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:12px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%;border-radius:0}
.row.bx{grid-template-columns:42px minmax(0,1.3fr) minmax(0,1fr) 240px 20px}
.rows .row:first-child,.thead+.row{border-top:0}
.row:hover{background:var(--surface-2)}
.thead{display:grid;gap:14px;padding:10px 12px;font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line)}
.thead.bx{grid-template-columns:42px minmax(0,1.3fr) minmax(0,1fr) 240px 20px}
.thead span:nth-child(4){text-align:right}
.r-main{min-width:0;display:flex;flex-direction:column;gap:2px}
.r-main b{font-size:16.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.r-main small{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-city{color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-only{display:none}
.r-pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.r-end{font-weight:800;text-align:right;white-space:nowrap}
@media (max-width:640px){.row,.row.bx{grid-template-columns:auto minmax(0,1fr) auto;padding:12px 6px}.row>.ic:last-child,.r-city,.thead{display:none}.m-only{display:inline}.r-pills{flex-direction:column;align-items:flex-end}}
.empty{text-align:center;padding:32px 16px;color:var(--muted)}
.empty p{margin:10px 0 16px;font-weight:600}

.kv{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}
.kv span{color:var(--muted)}
.kv b{text-align:right;font-weight:600;overflow-wrap:anywhere}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label,.flabel{font-weight:700;font-size:15px}
input,select,textarea{font:inherit;font-size:17px;min-height:52px;padding:11px 13px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
textarea{min-height:88px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--focus);outline:none}
.in-big{font-size:32px;font-weight:800;text-align:center;min-height:72px}
.row-in{display:flex;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -2px 14px}
.chip{min-height:44px;padding:0 16px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.chip .n{font-size:13px;opacity:.75}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.note{padding:11px 13px;border-radius:10px;background:var(--surface-2);font-size:15px;color:var(--muted);margin:0 0 14px}
.warnbox{padding:13px 15px;border-radius:10px;background:var(--z2b);color:var(--z2t);font-weight:700;margin-bottom:14px}
.pricebox{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;border-radius:10px;background:var(--z3b);color:var(--z3t);font-weight:700;margin-bottom:14px}
.pricebox b{font-size:23px;color:var(--ink)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;font-weight:700;cursor:pointer}
.switch input{width:26px;height:26px;min-height:0;accent-color:var(--primary)}
.check{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-weight:600;cursor:pointer}
.check input{width:24px;height:24px;min-height:0;accent-color:var(--primary);flex:none}

/* modal */
.ov{position:fixed;inset:0;background:var(--ov);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.m-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:-18px -18px 16px;padding:14px 18px;border-bottom:1px solid var(--line)}
.m-h h2{font-size:19px}
.m-f{display:flex;gap:10px;margin-top:6px}
.m-f .btn{flex:1}
@media (min-width:700px){.ov{align-items:center}.modal{border-radius:14px;padding:22px}.m-h{margin:-22px -22px 18px;padding:16px 22px}}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:#12262B;color:#fff;padding:12px 16px;border-radius:8px;display:flex;align-items:center;gap:10px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast .ic{color:#7BE495}
@media (min-width:901px){#toast{bottom:28px}}

/* login */
.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background-color:var(--hdr);background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:44px 44px}
.lg-card{width:100%;max-width:470px;background:var(--surface);border-radius:16px;padding:24px 20px}
.lg-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21px}
.lg-brand .langbtn{margin-left:auto}
.lg-tag{color:var(--muted);margin:6px 0 20px}
.lg-h{font-size:22px;margin:4px 0 14px}
.lg-roles,.lg-list{display:flex;flex-direction:column;gap:10px}
.lg-role{display:flex;align-items:center;gap:14px;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px;font-weight:700;text-align:left}
.lg-role:hover,.lg-route:hover,.lg-person:hover{border-color:var(--primary)}
.lg-role>span:nth-child(2){flex:1}
.lg-ic{width:50px;height:50px;border-radius:10px;background:var(--primary);color:var(--lime);display:grid;place-items:center}
.lg-route{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;text-align:left}
.rt{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:800}
.rt i{flex:1;height:2px;background:var(--soft);position:relative;min-width:56px;display:flex;align-items:center;justify-content:center;font-style:normal}
.rt i::before,.rt i::after{content:'';position:absolute;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--primary)}
.rt i::before{left:0}.rt i::after{right:0}
.rt i span{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--surface);border:2px solid var(--soft);color:var(--ptext)}
.lg-route:hover .rt i span{border-color:var(--primary)}
.lg-route-on span{display:inline-flex;align-items:center;gap:8px}
.lg-route small{color:var(--muted);font-size:15px}
.lg-person{display:flex;align-items:center;gap:14px;padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;text-align:left}
.lg-person span{display:flex;flex-direction:column}
.lg-person small{color:var(--muted);font-size:14.5px}
.lg-list{max-height:52vh;overflow:auto}
.lg-route-on{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-weight:700;margin-bottom:16px;font-size:15px}
.pin-dots{display:flex;justify-content:center;gap:16px;margin:10px 0 8px}
.pin-dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--primary)}
.pin-dots i.f{background:var(--primary)}
.pin-err{color:var(--red);text-align:center;font-weight:700;min-height:24px;margin:0 0 6px}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:310px;margin:0 auto}
.pinpad button{height:68px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);font-size:26px;font-weight:700;cursor:pointer;display:grid;place-items:center}
.pinpad button.ghost{background:transparent;border-color:transparent}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.hint{text-align:center;color:var(--muted);font-size:15px;margin-top:14px}

/* misc */
.money{display:grid;gap:10px}
.money>div{padding:12px 14px;border-radius:10px;background:var(--surface-2);display:flex;justify-content:space-between;align-items:center;gap:10px}
.money small{color:var(--muted);font-weight:600;font-size:15px}
.money b{font-size:21px}
.money .due{background:var(--z2b)}
.money .due small{color:var(--z2t)}
.bars{display:flex;align-items:flex-end;gap:10px;height:190px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.bar i{display:block;width:100%;border-radius:6px 6px 0 0;background:var(--soft)}
.bar.now i{background:var(--primary)}
.bar span{font-size:13px;color:var(--muted);font-weight:600}
.bar em{font-style:normal;font-weight:700;font-size:14px}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:grid;grid-template-columns:12px 1fr;gap:12px;padding:0 0 14px;position:relative}
.hist li::before{content:'';width:10px;height:10px;border-radius:50%;background:var(--primary);margin-top:7px}
.hist li::after{content:'';position:absolute;left:4px;top:20px;bottom:0;width:2px;background:var(--line)}
.hist li:last-child::after{display:none}
.hist b{display:block;font-weight:600}
.hist small{color:var(--muted)}
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.job{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:11px}
.job-top{display:flex;gap:12px;align-items:center;cursor:pointer}
.job-top div{min-width:0;flex:1}
.job-top b{display:block;font-size:17px}
.job-top small{color:var(--muted)}
.job-addr{display:flex;gap:10px;align-items:flex-start;font-weight:500}
.job-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.job-btns .btn.pri,.job-btns .btn.lime{grid-column:1/-1}
.sec-h{display:flex;align-items:center;gap:10px;margin:24px 0 10px}
.sec-h h2{font-size:18px}
.count{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1px 8px;font-weight:700;font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:left;font-weight:700;font-size:17px}
.tile:hover{border-color:var(--primary)}
.scan-big{display:flex;align-items:center;justify-content:center;gap:14px;min-height:76px;font-size:20px;border-radius:12px;width:100%}
.cam{position:relative;aspect-ratio:4/3;max-height:60vh;background:#0B1E23;border-radius:12px;overflow:hidden;margin-bottom:14px;display:grid;place-items:center}
.cam video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.cam-frame{position:absolute;inset:18%;border:3px solid var(--lime);border-radius:12px;pointer-events:none}
.cam-msg{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:10px;color:#cfe3e7;text-align:center;padding:20px;font-weight:600}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:12px 12px 12px 3px;padding:12px 14px;max-width:620px}
.bubble small{color:var(--muted);display:flex;gap:10px;justify-content:space-between;margin-top:6px;font-size:13px}
.bubbles{display:flex;flex-direction:column;gap:10px}
.wa{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--z4t);font-size:13.5px;margin-bottom:6px}
.label{width:320px;max-width:100%;margin:0 auto 18px;border:2px dashed var(--line);border-radius:10px;padding:18px;background:#fff;color:#102A31;text-align:center}
.lb-top{display:flex;align-items:center;justify-content:center;gap:8px;font-size:18px;font-weight:800}
.lb-qr{display:grid;place-items:center;margin:14px auto 8px;min-height:180px}
.lb-qr img,.lb-qr canvas{margin:0 auto}
.lb-id{font-size:30px;font-weight:800;letter-spacing:.03em}
.lb-to{display:flex;flex-direction:column;margin-top:10px;font-size:15px}
.lb-to b{font-size:18px}
.lb-kg{margin-top:10px;font-weight:800;font-size:20px;border-top:2px solid #102A31;padding-top:8px}
.bx-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:4px 0 14px}
.bx-id{font-weight:700;color:var(--ptext);font-size:15px;margin-bottom:4px;letter-spacing:.02em}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.items{display:flex;flex-wrap:wrap;gap:6px}
.cbox{cursor:pointer}
.cbox-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:16px}
.cbox-top b{font-size:17px;display:block}
.cbox .say{font-size:18px;margin-top:14px}
.done-ok{text-align:center;padding:20px 6px}
.done-ok .chipic{width:68px;height:68px;border-radius:50%;margin:0 auto 14px;background:var(--z4b);color:var(--z4t);border:0}

/* swipe rows */
.nav,.chips.scroll{scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.chips.scroll{cursor:grab}
.nav::-webkit-scrollbar,.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll.drag{cursor:grabbing;user-select:none}
.chips.scroll{--fl:0px;--fr:44px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 var(--fl),#000 calc(100% - var(--fr)),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 var(--fl),#000 calc(100% - var(--fr)),transparent 100%)}
.chips.scroll.at-end{--fr:0px}.chips.scroll.mid{--fl:32px}

/* slide-out menu */
#drawer .dr-ov{position:fixed;inset:0;background:var(--ov);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
#drawer.open .dr-ov{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(340px,88vw);background:var(--surface);border-left:1px solid var(--line);z-index:41;transform:translateX(105%);transition:transform .22s ease;display:flex;flex-direction:column;gap:14px;padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto;-webkit-overflow-scrolling:touch}
#drawer.open .drawer{transform:none}
@media (prefers-reduced-motion:reduce){.drawer,#drawer .dr-ov{transition:none}}
.dr-h{display:flex;align-items:center;gap:12px}
.dr-h div{flex:1;min-width:0}
.dr-h b{display:block;font-size:17px}
.dr-h small{color:var(--muted);font-size:14px}
.dr-nav{display:flex;flex-direction:column;border-top:1px solid var(--line);padding-top:8px}
.dr-nav a{display:flex;align-items:center;gap:14px;min-height:54px;padding:0 12px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:600;font-size:17px;border-left:3px solid transparent}
.dr-nav a span{flex:1}
.dr-nav a .ic{color:var(--muted)}
.dr-nav a.on{background:var(--surface-2);border-left-color:var(--primary);font-weight:800}
.dr-nav a.on .ic{color:var(--ptext)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface-2);padding:4px;border-radius:10px;border:1px solid var(--line)}
.seg button{min-height:44px;border:0;border-radius:7px;background:transparent;font-weight:700;cursor:pointer}
.seg button.on{background:var(--primary);color:#fff}
.dr-row{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;text-align:left}
.drawer .btn.bad{margin-top:auto}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:fixed;left:0;top:0;border:0}}
</style>

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function isoLocal(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const dayISO=o=>isoLocal(new Date(Date.now()+o*D));
const loc=()=>LANG()==='si'?'si-LK':'en-GB';
function fd(v){if(!v)return '—';const d=typeof v==='number'?new Date(v):new Date(v+'T00:00:00');if(isNaN(d))return '—';try{return d.toLocaleDateString(loc(),{day:'numeric',month:'short'})}catch(e){return d.toDateString().slice(4,10)}}
function fdt(ts){const d=new Date(ts);try{return d.toLocaleDateString(loc(),{day:'numeric',month:'short'})+', '+d.toLocaleTimeString(loc(),{hour:'2-digit',minute:'2-digit'})}catch(e){return d.toLocaleString()}}
function dayWord(iso){if(iso===dayISO(0))return T('today');if(iso===dayISO(1))return T('tomorrow');return fd(iso)}
const ils=n=>'₪'+Math.round(n||0).toLocaleString('en-US');
const lkr=n=>RT().sym+(RT().sym.length>1?' ':'')+Math.round(n||0).toLocaleString('en-US');
const initials=n=>String(n||'?').split(' ').filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase();

const mapHref=a=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a||'');

const B=id=>DB.boxes.find(b=>b.id===id);

const roleName=r=>r?(S.lang==='si'&&r.si?r.si:r.name):'—';

function zone(s){const i=sIdx(s);return i<=2?1:i===3?2:i<=6?3:4}
function can(p){if(!S.user)return false;if(S.user.t==='admin')return true;if(S.user.t!=='staff')return false;const s=ST(S.user.id);const r=s&&R(s.role);return !!(r&&r.perms.includes(p))}

function bal(b){return Math.max(0,Math.round((b.price||0)-paidOf(b)))}

function stLabel(b){return b.status==='out'&&b.mode==='point'?T('ready'):T('s_'+b.status)}
function stagePill(b){return `<span class="pill z${zone(b.status)}">${stLabel(b)}</span>`}

function itemName(k){return L[k]?T(k):k}
function kv(l,v){return `<div class="kv"><span>${l}</span><b>${v}</b></div>`}
function telLink(p){return p?`<a href="${telHref(p)}">${esc(p)}</a>`:'—'}
function sentence(b){
 const s=b.status;
 if(s==='booked')return b.onWay?T('driverOnWay'):tf('x_booked',{d:dayWord(b.pickupDate)});
 if(s==='shipped')return tf('x_shipped',{d:fd(b.eta)});
 if(s==='sl_wh')return b.addrOk?T('x_sl_wh_ok'):T('x_sl_wh');
 if(s==='out')return b.mode==='point'?tf('x_ready',{p:b.point}):T('x_out');
 if(s==='delivered')return tf('x_delivered',{d:fd(b.deliveredAt)});
 return T('x_'+s);
}

function setStatus(b,st,silent){
 b.status=st;b.hist.push({st,at:Date.now(),by:myName()});
 if(st==='delivered')b.deliveredAt=Date.now();
 if(st!=='booked')b.onWay=false;
 let key='n_'+st,p={id:b.id};
 if(st==='booked')p.d=fd(b.pickupDate);
 if(st==='picked'){p.kg=b.weight;p.price=ils(b.price)}
 if(st==='shipped')p.eta=fd(b.eta);
 if(st==='sl_wh')p.point=DB.settings.points[0]||'';
 if(st==='out'&&b.mode==='point'){key='n_ready';p.point=b.point}
 notify(b,key,p,silent);
}
function notify(b,key,p,silent){
 DB.msgs.unshift({id:'m'+Date.now()+Math.random().toString(36).slice(2,6),cust:b.cust,box:b.id,key,p,at:Date.now()});
 if(!silent)toast(tf('waSent',{n:C(b.cust).name.split(' ')[0]}),'msg');
}
function toast(text,icn='check'){
 const el=document.createElement('div');el.className='toast';el.innerHTML=ic(icn,20)+'<span>'+esc(text)+'</span>';
 $('toast').appendChild(el);setTimeout(()=>el.remove(),3200);
}
function gateNeed(b,target){
 const r=DB.settings.payRule;if(!b.price)return 0;const paid=paidOf(b);
 if(r==='split'){if(target==='il_wh'&&paid<b.price/2-0.5)return Math.ceil(b.price/2-paid);if(target==='delivered')return bal(b);return 0}
 const at={before:'picked',at:'il_wh',delivery:'delivered'}[r];
 if(!at)return 0;return sIdx(target)>=sIdx(at)?bal(b):0;
}
function guard(b,target,cb){const n=gateNeed(b,target);if(n>0){S.after=cb;openPay(b.id,n)}else cb()}

 const bx=DB.boxes,act=bx.filter(b=>b.status!=='delivered'),cnt=s=>bx.filter(b=>b.status===s).length;
 const pays=allPays(),inILS=pays.filter(p=>p.cur!=='LKR').reduce((a,p)=>a+p.amt,0),inLKR=pays.filter(p=>p.cur==='LKR').reduce((a,p)=>a+p.amt,0);
 const due=bx.reduce((a,b)=>a+bal(b),0);
 const follow=DB.calls.filter(c=>!c.done&&['request','callback','interested'].includes(c.out));
 const latest=[...bx].sort((a,z)=>z.created-a.created).slice(0,6);
 const conts=[...DB.containers].sort((a,z)=>z.created-a.created).slice(0,4);
 let date='';try{date=new Date().toLocaleDateString(loc(),{weekday:'long',day:'numeric',month:'long'})}catch(e){}
 return `<div class="hello"><div><h1>${greet({n:esc(DB.admin.name)})}</h1><p class="muted">${date}</p></div>
  <div class="hello-act"><button class="btn" onclick="openCall()">${ic('phone',20)} ${T('newCall')}</button><button class="btn pri" onclick="openBooking()">${ic('plus',20)} ${T('newBooking')}</button></div></div>
 <section class="card strip">${stat('box',T('activeBoxes'),act.length,'all')}${stat('truck',T('toPickUp'),cnt('booked'),'booked')}${stat('pin',T('waitingSL'),cnt('sl_wh')+cnt('out'),'sl')}${stat('checkc',T('deliveredMonth'),bx.filter(b=>b.status==='delivered'&&b.deliveredAt>Date.now()-30*D).length,'delivered')}</section>
 <section class="card"><div class="card-h"><h2><span class="chipic">${ic('map',20)}</span>${T('pipeline')}</h2></div>${pipeline()}</section>
 <div class="grid g3">
  <section class="card"><div class="card-h"><h2><span class="chipic">${ic('wallet',20)}</span>${T('money')}</h2><button class="lnk" onclick="go('payments')">${T('seeAll')}</button></div>
   <div class="money"><div><small>${T('receivedILS')}</small><b>${ils(inILS)}</b></div><div><small>${T('receivedLKR')}</small><b>${lkr(inLKR)}</b></div><div class="due"><small>${T('stillDue')}</small><b>${ils(due)}</b></div></div></section>
  <section class="card"><div class="card-h"><h2><span class="chipic">${ic('container',20)}</span>${T('containers')}</h2><button class="lnk" onclick="go('containers')">${T('seeAll')}</button></div>
   <div class="rows">${conts.map(contRow).join('')}</div></section>
  <section class="card"><div class="card-h"><h2><span class="chipic">${ic('phone',20)}</span>${T('followUps')}</h2><button class="lnk" onclick="go('calls')">${T('seeAll')}</button></div>
   <div class="rows">${follow.length?follow.slice(0,4).map(c=>`<button class="row" style="grid-template-columns:auto minmax(0,1fr) auto" onclick="go('calls')"><span class="av">${initials(c.name)}</span><span class="r-main"><b>${esc(c.name)}</b><small>${esc(c.note)}</small></span>${outPill(c.out)}</button>`).join(''):`<div class="empty">${T('noJobs')}</div>`}</div></section>
 </div>
 <div class="grid g21">
  <section class="card"><div class="card-h"><h2><span class="chipic">${ic('box',20)}</span>${T('latest')}</h2><button class="lnk" onclick="goBoxes('all')">${T('seeAll')}</button></div><div class="rows">${boxHead()+latest.map(boxRow).join('')}</div></section>
  <section class="card"><div class="card-h"><h2><span class="chipic">${ic('calendar',20)}</span>${T('perMonth')}</h2></div>${chart()}</section>
 </div>`;
}
function pipeline(){
 const cnt=s=>DB.boxes.filter(b=>b.status===s).length;
 return `<div class="pipe"><div class="band b-il" style="--c:1/4">${ic('home',16)} ${T('israel')}</div><div class="band b-sea" style="--c:4/5">${T('atSea')}</div><div class="band b-sl" style="--c:5/9">${T('sriLanka')}</div>
 ${STG.map((s,i)=>{const n=cnt(s);const hot=n>0&&(s==='booked'||s==='sl_wh');return `<button class="pstop ${n?'has':'zero'} ${hot?'hot':''}" style="--c:${i+1}" onclick="goBoxes('${s}')"><span class="pdot">${ic(STG_IC[s],24)}<b>${n}</b></span><span class="pl">${T('s_'+s)}</span></button>`}).join('')}</div>`;
}
function chart(){
 const m=DB.settings.monthly||[];const cur=(DB.settings.monthBase||0)+DB.boxes.filter(b=>{const d=new Date(b.created),n=new Date();return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear()}).length;
 const vals=[...m.slice(-5),cur],max=Math.max(...vals,1),now=new Date();
 return `<div class="bars">${vals.map((v,i)=>{const d=new Date(now.getFullYear(),now.getMonth()-(vals.length-1-i),1);let lbl='';try{lbl=d.toLocaleDateString(loc(),{month:'short'})}catch(e){}
  return `<div class="bar ${i===vals.length-1?'now':''}"><em>${v}</em><i style="height:${Math.max(8,v/max*140)}px"></i><span>${lbl}</span></div>`}).join('')}</div>`;
}
function boxHead(){return `<div class="thead bx"><span></span><span>${T('th_customer')}</span><span>${T('th_to')}</span><span>${T('th_status')}</span><span></span></div>`}
function boxRow(b){const c=C(b.cust);return `<button class="row bx" onclick="go('box','${b.id}')"><span class="av">${initials(c.name)}</span><span class="r-main"><b>${esc(c.name)}</b><small><span class="tag">${b.id}</span><span class="m-only">${esc(tf('toCity',{c:b.to.city||''}))}</span></small></span><span class="r-city">${esc(b.to.city||'')}</span><span class="r-pills">${stagePill(b)}${payPill(b)}</span>${ic('right',20)}</button>`}
function kPill(k){const z={loading:1,shipped:2,customs:3,arrived:4}[k.status];return `<span class="pill z${z}">${T('k_'+k.status)}</span>`}
function contRow(k){return `<button class="row" onclick="go('container','${k.id}')"><span class="av">${ic('container',20)}</span><span class="r-main"><b>${k.id}</b><small>${tf('boxCount',{n:k.boxes.length})}${k.eta&&k.status!=='arrived'?', '+T('eta').toLowerCase()+' '+fd(k.eta):''}</small></span><span class="r-pills">${kPill(k)}</span>${ic('right',20)}</button>`}
function outPill(o){const z={request:3,callback:2,interested:1,booked:4,notNow:''}[o];return `<span class="pill ${z?'z'+z:'plain'}">${T('out_'+o)}</span>`}

/* ---------------- boxes list ---------------- */
function boxMatch(b){
 const f=S.filter;let ok=f==='all'?b.status!=='delivered':f==='sl'?['sl_wh','out'].includes(b.status):f==='unpaid'?bal(b)>0:b.status===f;
 if(!ok)return false;const q=S.q.trim().toLowerCase();if(!q)return true;
 const c=C(b.cust);return [b.id,c.name,c.phone,b.to.name,b.to.city,b.to.phone].join(' ').toLowerCase().includes(q);
}
function boxListHTML(){const list=DB.boxes.filter(boxMatch).sort((a,z)=>z.created-a.created);return list.length?boxHead()+list.map(boxRow).join(''):`<div class="empty">${ic('box',34)}<p>${T('noBoxesHere')}</p></div>`}
function vBoxes(){
 const cnt=f=>DB.boxes.filter(b=>f==='all'?b.status!=='delivered':f==='unpaid'?bal(b)>0:b.status===f).length;
 const fl=[['all',T('f_active')],...STG.map(s=>[s,T('s_'+s)]),['unpaid',T('f_unpaid')]];
 if(S.filter==='sl')fl.splice(1,0,['sl',T('waitingSL')]);
 return `<div class="hello"><h1>${T('boxes')}</h1>${can('calls')?`<button class="btn pri" onclick="openBooking()">${ic('plus',20)} ${T('newBooking')}</button>`:''}</div>
 <div class="field"><input type="search" placeholder="${T('search')}" value="${esc(S.q)}" oninput="S.q=this.value;$('boxlist').innerHTML=boxListHTML()" aria-label="${T('search')}"></div>
 <div class="chips scroll">${fl.map(([v,l])=>`<button class="chip ${S.filter===v?'on':''}" onclick="S.filter='${v}';render()">${l}${v!=='sl'?` <span class="n">${cnt(v)}</span>`:''}</button>`).join('')}</div>
 <section class="card" style="padding:8px"><div class="rows" id="boxlist">${boxListHTML()}</div></section>`;
}

/* ---------------- one box (admin + staff) ---------------- */
function track(b,sm){const i=sIdx(b.status);return `<div class="track ${sm?'sm':''}" role="img" aria-label="${esc(stLabel(b))}">${STG.map((s,k)=>{const cls=k<i||b.status==='delivered'?'done':k===i?'cur':'';return `<div class="stop ${cls}"><span class="dot">${ic(cls==='done'?'check':STG_IC[s],sm?15:20)}</span><span class="sl">${s==='out'&&b.mode==='point'?T('ready'):T('s_'+s)}</span></div>`}).join('')}</div>`}
function etaBlock(b){return (b.status==='shipped'||b.status==='customs')&&b.eta?`<div class="eta">${ic('ship',30)}<div>${T('eta')}<b>${fd(b.eta)}</b></div></div>`:''}
function actionsFor(b){
 const a=[],s=b.status,A=(l,i,fn,cls)=>a.push({l,i,fn,cls});
 if(s==='booked'&&can('pickup')){if(!b.onWay)A(T('actOnWay'),'truck',`actOnWay('${b.id}')`,'');A(T('actPicked'),'check',`openWeigh('${b.id}')`,'pri')}
 if(s==='picked'&&can('wh_il'))A(T('actWh'),'warehouse',`actCheckIn('${b.id}')`,'pri');
 if(s==='il_wh'&&can('wh_il')&&!b.cont)A(T('actContainer'),'container',`openLoad('${b.id}')`,'pri');
 if((s==='shipped'||s==='customs')&&can('wh_sl'))A(T('actArrived'),'pin',`actArrive('${b.id}')`,'pri');
 if(s==='sl_wh'&&can('wh_sl')){A(b.addrOk?T('changeDelivery'):T('confirmAddress'),'map',`openAddr('${b.id}')`,b.addrOk?'':'pri');if(b.addrOk)A(b.mode==='point'?T('actReady'):T('actOut'),'truck',`openSendOut('${b.id}')`,'pri')}
 if(s==='out'&&(can('deliver')||can('wh_sl')))A(T('actDelivered'),'checkc',`openDeliver('${b.id}')`,'lime');
 if(s!=='delivered'&&b.price&&bal(b)>0&&can('cash'))A(T('collect'),'wallet',`openPay('${b.id}')`,'');
 if(['picked','il_wh'].includes(s)&&can('wh_il'))A(T('printLabel'),'print',`openLabel('${b.id}')`,'ghost');
 return a;
}
function histLabel(h){if(STG.includes(h.st))return T('s_'+h.st);return T('h_'+h.st)}
function vBox(id){
 const b=B(id);if(!b)return backBtn()+`<div class="empty">${T('notFound')}</div>`;
 const c=C(b.cust),acts=actionsFor(b),drv=ST(b.drvIL),drv2=ST(b.drvSL),pays=b.pays||[];
 return `${backBtn()}
 <div class="bx-head"><div><div class="bx-id">${b.id}</div><h1>${esc(c.name)}</h1></div><div class="pills">${stagePill(b)}${payPill(b)}</div></div>
 <section class="card">${track(b)}<p class="say">${esc(sentence(b))}</p>${etaBlock(b)}</section>
 ${acts.length?`<div class="acts">${acts.map(x=>`<button class="btn big ${x.cls}" onclick="${x.fn}">${ic(x.i)} ${x.l}</button>`).join('')}</div>`:''}
 <div class="grid g2">
  <section class="card"><h3><span class="chipic">${ic('home',18)}</span>${T('sender')}</h3>${kv(T('name'),S.user.t==='admin'?`<a href="#" onclick="go('customer','${c.id}');return false">${esc(c.name)}</a>`:esc(c.name))}${kv(T('phone'),telLink(c.phone))}${kv(T('address'),`<a href="${mapHref(b.from)}" target="_blank" rel="noopener">${esc(b.from)}</a>`)}${kv(T('pickupDate'),dayWord(b.pickupDate))}${kv(T('driver'),drv?esc(drv.name):'—')}</section>
  <section class="card"><h3><span class="chipic">${ic('pin',18)}</span>${T('receiver')}</h3>${kv(T('name'),esc(b.to.name))}${kv(T('phone'),telLink(b.to.phone))}${kv(T('address'),esc(b.to.addr))}${kv(T('delivery'),b.mode==='point'?T('pickupPoint')+(b.point?': '+esc(b.point):''):T('homeDelivery'))}${kv('',b.addrOk?`<span class="pill ok">${ic('check',14)}${T('confirmed')}</span>`:`<span class="pill warn">${T('notConfirmed')}</span>`)}${drv2?kv(T('driver'),esc(drv2.name)):''}</section>
  <section class="card"><h3><span class="chipic">${ic('box',18)}</span>${T('theBox')}</h3><div class="items" style="margin-bottom:10px">${b.items.map(i=>`<span class="pill plain">${esc(itemName(i))}</span>`).join('')}${b.other?`<span class="pill plain">${esc(b.other)}</span>`:''}</div>${kv(T('weight'),b.weight?b.weight+' kg':'~'+b.est+' kg')}${kv(T('container'),b.cont?`<a href="#" onclick="go('container','${b.cont}');return false">${b.cont}</a>`:T('noCont'))}${b.eta?kv(T('eta'),fd(b.eta)):''}</section>
  <section class="card"><h3><span class="chipic">${ic('wallet',18)}</span>${T('payment')}</h3>${kv(T('price'),ils(b.price)+(b.weight?'':' (~)'))}${kv(T('paid'),ils(paidOf(b)))}${kv(T('balance'),`<span style="color:${bal(b)?'var(--red)':'inherit'}">${ils(bal(b))}</span>`)}
   ${pays.map(p=>kv(`${fd(p.at)}, ${T(p.method)}`,p.cur==='LKR'?lkr(p.amt):ils(p.amt))).join('')}</section>
 </div>
 <section class="card"><h3><span class="chipic">${ic('clock',18)}</span>${T('history')}</h3><ol class="hist">${[...b.hist].reverse().map(h=>`<li><div><b>${histLabel(h)}${h.note?': '+esc(h.note):''}</b><small>${fdt(h.at)}${h.by?', '+esc(h.by):''}</small></div></li>`).join('')}</ol></section>`;
}

/* ---------------- box action flows ---------------- */
function actOnWay(id){const b=B(id);b.onWay=true;b.hist.push({st:'onway',at:Date.now(),by:myName()});notify(b,'n_onway',{id:b.id});done()}
function openWeigh(id){const b=B(id),r=DB.settings.rate;
 modal(T('actPicked'),`<div class="field"><label for="wkg">${T('realWeight')}</label><input id="wkg" class="in-big" type="number" inputmode="decimal" min="0" step="0.5" value="${b.weight||b.est}" oninput="$('wprice').textContent=ils((parseFloat(this.value)||0)*${r})"></div>
 <div class="pricebox"><span>${T('price')}</span><b id="wprice">${ils((b.weight||b.est)*r)}</b></div>`,
 `<button class="btn" onclick="closeM()">${T('cancel')}</button><button class="btn pri" onclick="saveWeigh('${id}')">${ic('check')} ${T('actPicked')}</button>`)}
function saveWeigh(id){const b=B(id),kg=parseFloat($('wkg').value);if(!(kg>0)){toast(T('needWeight'),'x');return}
 b.weight=kg;b.price=Math.round(kg*DB.settings.rate);closeM();save();
 guard(b,'picked',()=>{setStatus(b,'picked');done()})}
function actCheckIn(id){const b=B(id);guard(b,'il_wh',()=>{setStatus(b,'il_wh');done();openLabel(id)})}
function openLoad(id){
 const ks=DB.containers.filter(k=>k.status==='loading');
 modal(T('actContainer'),`<div class="rows">${ks.map(k=>`<button class="row" style="grid-template-columns:auto 1fr auto" onclick="loadInto('${id}','${k.id}')"><span class="av">${ic('container',20)}</span><span class="r-main"><b>${k.id}</b><small>${tf('boxCount',{n:k.boxes.length})}</small></span>${ic('right')}</button>`).join('')}</div>
 <button class="btn big ${ks.length?'':'pri'}" style="margin-top:12px" onclick="loadInto('${id}',newContainer())">${ic('plus')} ${T('startNew')}</button>`)}
function newContainer(){const id='CN-'+(DB.kseq++);DB.containers.push({id,status:'loading',boxes:[],shipDate:null,eta:null,created:Date.now()});save();return id}
function loadInto(id,kid){const b=B(id),k=K(kid);if(b.cont)return;b.cont=kid;k.boxes.push(id);b.hist.push({st:'load',at:Date.now(),by:myName(),note:kid});closeM();toast(tf('inContainer',{k:kid}));done()}
function actArrive(id){const b=B(id);setStatus(b,'sl_wh');done()}
function openAddr(id){const b=B(id),mode=b.mode||'home';
 modal(T('confirmAddress'),`<div class="field"><span class="flabel">${T('delivery')}</span>${chipsHTML('mode',[['home',T('homeDelivery')],['point',T('pickupPoint')]],mode)}</div>
 <div class="field" id="ptWrap" style="display:${mode==='point'?'flex':'none'}"><label for="apt">${T('pickupPoint')}</label><select id="apt">${DB.settings.points.map(p=>`<option ${p===b.point?'selected':''}>${esc(p)}</option>`).join('')}</select></div>
 <div class="field"><label for="anm">${T('name')}</label><input id="anm" value="${esc(b.to.name)}"></div>
 <div class="field"><label for="aph">${T('phone')}</label><input id="aph" type="tel" value="${esc(b.to.phone)}"></div>
 <div class="field"><label for="aad">${T('slAddr')}</label><textarea id="aad">${esc(b.to.addr)}</textarea></div>`,
 `<button class="btn" onclick="closeM()">${T('cancel')}</button><button class="btn pri" onclick="saveAddr('${id}')">${ic('check')} ${T('confirmAddress')}</button>`);
 CHIPCB.mode=v=>{$('ptWrap').style.display=v==='point'?'flex':'none'}}
function saveAddr(id){const b=B(id);b.mode=cv('mode')||'home';b.point=b.mode==='point'?$('apt').value:null;b.to.name=$('anm').value.trim()||b.to.name;b.to.phone=$('aph').value.trim();b.to.addr=$('aad').value.trim();b.addrOk=true;
 b.hist.push({st:'addr',at:Date.now(),by:myName(),note:b.mode==='point'?b.point:T('homeDelivery')});closeM();toast(T('saved'));done()}
function openSendOut(id){const b=B(id);
 if(b.mode==='point'){setStatus(b,'out');done();return}
 const ds=DB.staff.filter(s=>s.active&&(R(s.role)||{perms:[]}).perms.includes('deliver'));
 modal(T('actOut'),`<div class="field"><span class="flabel">${T('pickDriver')}</span>${chipsHTML('drv',ds.map(s=>[s.id,esc(s.name)]),b.drvSL||(ds[0]||{}).id)}</div>`,
 `<button class="btn" onclick="closeM()">${T('cancel')}</button><button class="btn pri" onclick="saveSendOut('${id}')">${ic('truck')} ${T('actOut')}</button>`)}
function saveSendOut(id){const b=B(id);b.drvSL=cv('drv');closeM();setStatus(b,'out');done()}
function openDeliver(id){const b=B(id);guard(b,'delivered',()=>{
 modal(T('actDelivered'),`<div class="field"><label for="dwho">${T('whoReceived')}</label><input id="dwho" value="${esc(b.to.name)}"></div>`,
 `<button class="btn" onclick="closeM()">${T('cancel')}</button><button class="btn lime" onclick="saveDeliver('${id}')">${ic('checkc')} ${T('handover')}</button>`)})}
function saveDeliver(id){const b=B(id);const w=$('dwho').value.trim();closeM();setStatus(b,'delivered');b.hist[b.hist.length-1].note=w;done()}

/* ---------------- payments (staff/admin) ---------------- */
function openPay(id,need){const b=B(id),due=bal(b),gate=!!need;
 modal(T('collect'),`${gate?`<div class="warnbox">${tf('payFirst',{a:ils(need)})}</div>`:''}
 <div class="pricebox"><span>${T('balance')}</span><b>${ils(due)}</b></div>
 <div class="field"><span class="flabel">${T('currency')}</span>${chipsHTML('cur',[['ILS','₪ Shekel'],['LKR',RT().sym+' '+RT().cur]],'ILS')}</div>
 <div class="field"><label for="pamt">${T('amount')}</label><input id="pamt" class="in-big" type="number" inputmode="decimal" min="0" value="${due}"></div>
 <div class="field"><span class="flabel">${T('method')}</span>${chipsHTML('pm',[['cash',T('cash')],['card',T('card')],['bank',T('bank')]],'cash')}</div>`,
 `${gate&&S.user.t==='admin'?`<button class="btn" onclick="skipGate()">${T('skip')}</button>`:`<button class="btn" onclick="S.after=null;closeM()">${T('cancel')}</button>`}<button class="btn pri" onclick="savePay('${id}')">${ic('check')} ${T('save')}</button>`);
 CHIPCB.cur=v=>{$('pamt').value=v==='LKR'?Math.round(due*DB.settings.lkrRate):due}}
function savePay(id){const b=B(id),amt=parseFloat($('pamt').value),cur=cv('cur')||'ILS',m=cv('pm')||'cash';if(!(amt>0))return;
 addPay(b,amt,cur,m);closeM();const cb=S.after;S.after=null;save();
 if(cb){if(gateNeed(b,cbTarget(b))>0){render()}else cb()}else render()}
function cbTarget(b){return {booked:'picked',picked:'il_wh',out:'delivered'}[b.status]||b.status}
function addPay(b,amt,cur,m){b.pays.push({amt,cur,method:m,at:Date.now(),by:myName()});const a=cur==='LKR'?lkr(amt):ils(amt);b.hist.push({st:'pay',at:Date.now(),by:myName(),note:a});notify(b,'n_paid',{id:b.id,amt:a},true);toast(T('h_pay')+': '+a,'wallet')}
function skipGate(){const cb=S.after;S.after=null;closeM();cb&&cb()}

/* ---------------- labels + QR ---------------- */
function openLabel(id){const b=B(id);
 modal(T('label'),`<div id="printArea" class="label"><div class="lb-top">${logoMark(26)}<span>Janath Cargo</span></div><div class="lb-qr" data-qr="${b.id}"></div><div class="lb-id">${b.id}</div><div class="lb-to"><b>${esc(b.to.name)}</b><span>${esc(b.to.city)}</span><span>${esc(b.to.phone)}</span></div><div class="lb-kg">${b.weight||b.est} kg</div></div>`,
 `<button class="btn" onclick="closeM()">${T('close')}</button><button class="btn pri" onclick="window.print()">${ic('print')} ${T('print')}</button>`)}
function openKLabel(kid){const k=K(kid);
 modal(T('label'),`<div id="printArea" class="label"><div class="lb-top">${logoMark(26)}<span>Janath Cargo</span></div><div class="lb-qr" data-qr="${k.id}"></div><div class="lb-id">${k.id}</div><div class="lb-kg">${tf('boxCount',{n:k.boxes.length})}</div></div>`,
 `<button class="btn" onclick="closeM()">${T('close')}</button><button class="btn pri" onclick="window.print()">${ic('print')} ${T('print')}</button>`)}
function renderQRs(root){root.querySelectorAll('[data-qr]').forEach(el=>{if(el.dataset.done)return;el.dataset.done=1;

/* ---------------- modal + chips ---------------- */
const CHIPCB={};

 renderQRs($('modal'));const f=$('modal').querySelector('input:not([type=checkbox]),select,textarea');if(f&&window.innerWidth>700)setTimeout(()=>f.focus(),30)}
function closeM(){$('modal').innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if($('modal').innerHTML){S.after=null;closeM()}else if(S.drawer)closeDrawer()});
function chipsHTML(g,opts,sel,multi){return `<div class="chips" role="group">${opts.map(([v,l])=>{const on=multi?(sel||[]).includes(v):sel===v;return `<button type="button" class="chip ${on?'on':''}" aria-pressed="${on}" data-g="${g}" data-v="${esc(v)}" onclick="chip(this,${multi?1:0})">${l}</button>`}).join('')}</div>`}
function chip(el,multi){if(multi)el.classList.toggle('on');else{document.querySelectorAll(`[data-g="${el.dataset.g}"]`).forEach(x=>{x.classList.remove('on');x.setAttribute('aria-pressed','false')});el.classList.add('on')}
 el.setAttribute('aria-pressed',el.classList.contains('on'));const f=CHIPCB[el.dataset.g];f&&f(el.dataset.v)}
function cv(g){const e=document.querySelector(`[data-g="${g}"].on`);return e?e.dataset.v:null}
function cvs(g){return [...document.querySelectorAll(`[data-g="${g}"].on`)].map(e=>e.dataset.v)}

 <section class="card" style="padding:8px"><div class="rows">${DB.staff.map(s=>`<button class="row" onclick="openStaff('${s.id}')"><span class="av">${initials(s.name)}</span><span class="r-main"><b>${esc(s.name)}</b><small>${esc(s.phone)}, PIN ${esc(s.pin)}</small></span><span class="r-pills"><span class="pill z1">${esc(roleName(R(s.role)))}</span>${s.active?'':`<span class="pill bad">${T('off')}</span>`}</span>${ic('edit',20)}</button>`).join('')}</div></section>
 <div class="hello" style="margin-top:28px"><h2>${T('roles')}</h2><button class="btn" onclick="openRole()">${ic('plus',20)} ${T('addRole')}</button></div>
 <div class="jobs">${DB.roles.map(r=>`<div class="job" style="cursor:pointer" onclick="openRole('${r.id}')"><div class="job-top"><span class="chipic">${ic('key',18)}</span><div><b>${esc(roleName(r))}</b><small>${DB.staff.filter(s=>s.role===r.id).length} ${T('staffNav').toLowerCase()}</small></div>${ic('edit',20)}</div><div class="items">${r.perms.map(p=>`<span class="pill plain">${T('p_'+p)}</span>`).join('')}</div></div>`).join('')}</div>`}
function openStaff(id){const s=id?ST(id):{name:'',phone:'',role:DB.roles[0].id,pin:String(Math.floor(1000+Math.random()*9000)),active:true};
 modal(id?T('edit'):T('addStaff'),`<div class="field"><label for="sfn">${T('name')}</label><input id="sfn" value="${esc(s.name)}"></div>
 <div class="field"><label for="sfp">${T('phone')}</label><input id="sfp" type="tel" value="${esc(s.phone)}"></div>
 <div class="field"><span class="flabel">${T('role')}</span>${chipsHTML('srole',DB.roles.map(r=>[r.id,esc(roleName(r))]),s.role)}</div>
 <div class="field"><label for="sfpin">${T('pin')}</label><input id="sfpin" inputmode="numeric" maxlength="4" value="${esc(s.pin)}"></div>
 <label class="switch">${T('active')}<input type="checkbox" id="sfa" ${s.active?'checked':''}></label>`,
 `<button class="btn" onclick="closeM()">${T('cancel')}</button><button class="btn pri" onclick="saveStaff('${id||''}')">${ic('check')} ${T('save')}</button>`)}
function saveStaff(id){const n=$('sfn').value.trim(),pin=$('sfpin').value.replace(/\D/g,'');if(!n||pin.length!==4){toast(T('fillAll'),'x');return}
 const d={name:n,phone:$('sfp').value.trim(),role:cv('srole')||DB.roles[0].id,pin,active:$('sfa').checked};
 if(id)Object.assign(ST(id),d);else DB.staff.push({id:'s'+Date.now(),...d});closeM();toast(T('saved'));done()}
function openRole(id){const r=id?R(id):{name:'',perms:[]};
 modal(id?T('edit'):T('addRole'),`<div class="field"><label for="rnm">${T('name')}</label><input id="rnm" value="${esc(id?roleName(r):'')}"></div>
 <div>${PERMS.map(p=>`<label class="check"><input type="checkbox" class="rp" value="${p}" ${r.perms.includes(p)?'checked':''}><span>${T('p_'+p)}</span></label>`).join('')}</div>`,
 `<button class="btn" onclick="closeM()">${T('cancel')}</button><button class="btn pri" onclick="saveRole('${id||''}')">${ic('check')} ${T('save')}</button>`)}
function saveRole(id){const n=$('rnm').value.trim();if(!n)return;const perms=[...document.querySelectorAll('.rp:checked')].map(e=>e.value);
 if(id){const r=R(id);if(S.lang==='si')r.si=n;else r.name=n;r.perms=perms}else DB.roles.push({id:'r'+Date.now(),name:n,si:'',perms});closeM();toast(T('saved'));done()}
function bubble(m,showName){return `<div class="bubble"><div class="wa">${ic('msg',16)} WhatsApp${showName?`, ${esc(C(m.cust).name)}`:''}</div>${esc(tf(m.key,m.p))}<small><span>${m.box}</span><span>${fdt(m.at)}</span></small></div>`}
function vMsgs(){return `${backBtn()}<div class="hello"><h1>${T('messages')}</h1></div><div class="bubbles">${DB.msgs.slice(0,60).map(m=>bubble(m,1)).join('')}</div>`}
function vSettings(){const st=DB.settings;
 return `${backBtn()}<div class="hello"><h1>${T('settings')}</h1></div><div class="grid g2"><section class="card">
 <div class="two"><div class="field"><label for="srt">${T('rate')}</label><input id="srt" type="number" inputmode="decimal" value="${st.rate}"></div><div class="field"><label for="slr">${T('lkrRate')}</label><input id="slr" type="number" inputmode="decimal" value="${st.lkrRate}"></div></div>
 <div class="field"><span class="flabel">${T('payRule')}</span>${chipsHTML('prule',['any','before','at','delivery','split'].map(v=>[v,T('pr_'+v)]),st.payRule)}</div>
 <div class="field"><label for="spt">${T('points')}</label><textarea id="spt">${esc(st.points.join('\n'))}</textarea></div>
 <button class="btn pri big" onclick="saveSettings()">${ic('check')} ${T('save')}</button></section>
 <section class="card"><button class="btn bad big" onclick="resetDemo()">${T('reset')}</button></section></div>`}
function saveSettings(){const st=DB.settings;st.rate=parseFloat($('srt').value)||st.rate;st.lkrRate=parseFloat($('slr').value)||st.lkrRate;st.payRule=cv('prule')||'any';st.points=$('spt').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!st.points.length)st.points=['Main office'];toast(T('saved'));done()}
function resetDemo(){if(!confirm(T('resetQ')))return;DB=seed(S.route);save();S.page='home';render()}

/* ---------------- staff: jobs ---------------- */
function jobCard(b,kind){const c=C(b.cust),il=kind==='pickup',addr=il?b.from:b.to.addr,ph=il?c.phone:b.to.phone,nm=il?c.name:b.to.name;
 let main='';
 if(kind==='pickup')main=`${!b.onWay?`<button class="btn" onclick="actOnWay('${b.id}')">${ic('truck',20)} ${T('actOnWay')}</button>`:''}<button class="btn pri" onclick="openWeigh('${b.id}')">${ic('check')} ${T('actPicked')}</button>`;
 if(kind==='checkin')main=`<button class="btn pri" onclick="actCheckIn('${b.id}')">${ic('warehouse')} ${T('actWh')}</button>`;
 if(kind==='load')main=`<button class="btn pri" onclick="openLoad('${b.id}')">${ic('container')} ${T('actContainer')}</button>`;
 if(kind==='sl')main=b.addrOk?`<button class="btn pri" onclick="openSendOut('${b.id}')">${ic('truck')} ${b.mode==='point'?T('actReady'):T('actOut')}</button>`:`<button class="btn pri" onclick="openAddr('${b.id}')">${ic('map')} ${T('confirmAddress')}</button>`;
 if(kind==='deliver')main=`<button class="btn lime" onclick="openDeliver('${b.id}')">${ic('checkc')} ${T('actDelivered')}</button>`;
 const when=kind==='pickup'?`<span class="pill ${b.pickupDate===dayISO(0)?'z3':'plain'}">${dayWord(b.pickupDate)}</span>`:stagePill(b);
 return `<div class="job"><div class="job-top" onclick="go('box','${b.id}')"><span class="av">${initials(nm)}</span><div><b>${esc(nm)}</b><small><span class="tag">${b.id}</span>${b.weight||b.est} kg</small></div>${when}</div>
 <div class="job-addr">${ic('pin',20)}<span>${esc(addr)}</span></div>${bal(b)&&can('cash')?`<div class="job-addr" style="color:var(--red)">${ic('wallet',20)}<span>${T('balance')}: ${ils(bal(b))}</span></div>`:''}
 <div class="job-btns"><a class="btn sm" href="${telHref(ph)}">${ic('phone',18)} ${T('call')}</a><a class="btn sm" href="${mapHref(addr)}" target="_blank" rel="noopener">${ic('map',18)} ${T('map')}</a>${main}</div></div>`}
function sec(title,html,n){return `<div class="sec-h"><h2>${title}</h2><span class="count">${n}</span></div>${n?`<div class="jobs">${html}</div>`:`<div class="card empty">${T('noJobs')}</div>`}`}
function vJobs(){const me=ST(S.user.id);let h='';
 if(can('pickup')){const l=DB.boxes.filter(b=>b.status==='booked'&&(!b.drvIL||b.drvIL===me.id)).sort((a,z)=>a.pickupDate.localeCompare(z.pickupDate));h+=sec(T('jobsPickup'),l.map(b=>jobCard(b,'pickup')).join(''),l.length)}
 if(can('wh_il')){const a=DB.boxes.filter(b=>b.status==='picked');h+=sec(T('jobsCheckIn'),a.map(b=>jobCard(b,'checkin')).join(''),a.length);
  const l=DB.boxes.filter(b=>b.status==='il_wh'&&!b.cont);h+=sec(T('jobsLoad'),l.map(b=>jobCard(b,'load')).join(''),l.length)}
 if(can('wh_sl')){const ks=DB.containers.filter(k=>k.status==='shipped'||k.status==='customs');h+=`<div class="sec-h"><h2>${T('jobsIncoming')}</h2><span class="count">${ks.length}</span></div>${ks.length?`<section class="card" style="padding:8px"><div class="rows">${ks.map(contRow).join('')}</div></section>`:`<div class="card empty">${T('noJobs')}</div>`}`;
  const l=DB.boxes.filter(b=>b.status==='sl_wh');h+=sec(T('jobsSL'),l.map(b=>jobCard(b,'sl')).join(''),l.length)}
 if(can('deliver')||can('wh_sl')){const l=DB.boxes.filter(b=>b.status==='out'&&(can('wh_sl')?true:b.drvSL===me.id));h+=sec(T('jobsDeliver'),l.map(b=>jobCard(b,'deliver')).join(''),l.length)}
 if(can('calls')){const l=DB.calls.filter(c=>!c.done);h+=sec(T('jobsCalls'),l.map(callCard).join(''),l.length)}
 return `<div class="hello"><div><h1>${greet({n:esc(me.name.split(' ')[0])})}</h1><p><span class="pill z1">${esc(roleName(R(me.role)))}</span></p></div></div>
 <button class="btn lime scan-big" onclick="go('scan')">${ic('scan',30)} ${T('scan')}</button>${h}`}

/* ---------------- scan ---------------- */
let CAM={stream:null,raf:null};
function vScan(){const demo=[...DB.boxes.filter(b=>b.status!=='delivered').slice(-6).map(b=>b.id),...DB.containers.filter(k=>k.status!=='arrived').map(k=>k.id)];
 return `${S.user.t==='admin'?backBtn():''}<div class="hello"><h1>${T('scan')}</h1></div><div class="grid g2">
 <section class="card"><div class="cam"><video id="vid" playsinline muted></video><div class="cam-frame"></div><div id="camMsg" class="cam-msg">${ic('camera',38)}<span>${T('scanHint')}</span></div></div>
 <button class="btn pri big" id="camBtn" onclick="CAM.stream?stopCam(1):startCam()">${ic('camera')} ${T('startCamera')}</button></section>
 <section class="card"><div class="field"><label for="scanId">${T('typeId')}</label><div class="row-in"><input id="scanId" placeholder="${DB.pre}${DB.seq-5}" autocapitalize="characters" onkeydown="if(event.key==='Enter')findId()"><button class="btn pri" onclick="findId()">${T('find')}</button></div></div>
 <p class="flabel" style="margin:6px 0 10px">${T('tryDemo')}</p><div class="chips">${demo.map(i=>`<button class="chip" onclick="handleCode('${i}')">${ic(i.startsWith('CN')?'container':'qr',18)} ${i}</button>`).join('')}</div></section></div>`}
async function startCam(){const msg=$('camMsg');
 try{if(!navigator.mediaDevices||!window.jsQR)throw 0;
  CAM.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=$('vid');v.srcObject=CAM.stream;await v.play();
  msg.style.display='none';$('camBtn').innerHTML=ic('x')+' '+T('stopCamera');
  const cv=document.createElement('canvas'),ctx=cv.getContext('2d',{willReadFrequently:true});
  const tick=()=>{if(!CAM.stream)return;if(v.readyState===v.HAVE_ENOUGH_DATA){cv.width=v.videoWidth;cv.height=v.videoHeight;ctx.drawImage(v,0,0);const img=ctx.getImageData(0,0,cv.width,cv.height);const code=jsQR(img.data,img.width,img.height,{inversionAttempts:'dontInvert'});if(code&&code.data){const t=code.data.trim().toUpperCase();if(B(t)||K(t)){if(navigator.vibrate)navigator.vibrate(80);handleCode(t);return}if(CAM.last!==t){CAM.last=t;toast(T('notFound'),'x')}}}CAM.raf=requestAnimationFrame(tick)};tick();
 }catch(e){stopCam();if(msg){msg.style.display='flex';msg.innerHTML=ic('camera',38)+'<span>'+T('camFail')+'</span>'}}}
function stopCam(re){if(CAM.raf)cancelAnimationFrame(CAM.raf);CAM.raf=null;if(CAM.stream){CAM.stream.getTracks().forEach(t=>t.stop());CAM.stream=null}if(re===1&&S.page==='scan')render()}
function findId(){let v=$('scanId').value.trim().toUpperCase();if(/^\d+$/.test(v))v=DB.pre+v;handleCode(v)}
function handleCode(t){t=String(t).trim().toUpperCase();if(B(t)){go('box',t);return}if(K(t)){go('container',t);return}toast(T('notFound'),'x')}

/* ---------------- customer portal ---------------- */
function cBoxCard(b){return `<section class="card cbox" onclick="go('box','${b.id}')"><div class="cbox-top"><div><span class="tag">${b.id}</span><b style="margin-top:6px">${esc(tf('toWho',{n:b.to.name,c:b.to.city}))}</b></div>${payPill(b)}</div>
 ${track(b,1)}<p class="say">${esc(sentence(b))}</p>${etaBlock(b)}
 ${(b.status==='sl_wh'&&!b.addrOk)||bal(b)?`<div class="acts" style="margin:16px 0 0" onclick="event.stopPropagation()">${b.status==='sl_wh'&&!b.addrOk?`<button class="btn lime big" onclick="openAddr('${b.id}')">${ic('map')} ${T('chooseDelivery')}</button>`:''}${bal(b)?`<button class="btn pri big" onclick="openCPay('${b.id}')">${ic('card')} ${T('payNow')} ${ils(bal(b))}</button>`:''}</div>`:''}</section>`}
function vCHome(){const c=C(S.user.id),mine=DB.boxes.filter(b=>b.cust===c.id).sort((a,z)=>z.created-a.created),act=mine.filter(b=>b.status!=='delivered'),dn=mine.filter(b=>b.status==='delivered');
 return `<div class="hello"><h1>${greet({n:esc(c.name.split(' ')[0])})}</h1><button class="btn pri" onclick="go('send')">${ic('plus',20)} ${T('sendBox')}</button></div>

 ${dn.length?`<div class="sec-h"><h2>${T('delivered')}</h2><span class="count">${dn.length}</span></div><section class="card" style="padding:8px"><div class="rows">${dn.map(b=>`<button class="row" onclick="go('box','${b.id}')"><span class="av">${ic('checkc',20)}</span><span class="r-main"><b>${esc(tf('toWho',{n:b.to.name,c:b.to.city}))}</b><small><span class="tag">${b.id}</span>${fd(b.deliveredAt)}</small></span><span></span>${ic('right',20)}</button>`).join('')}</div></section>`:''}`}
function vCBox(id){const b=B(id);if(!b||b.cust!==S.user.id)return backBtn()+`<div class="empty">${T('notFound')}</div>`;
 return `${backBtn()}<div class="bx-head"><div><div class="bx-id">${b.id}</div><h1>${esc(tf('toWho',{n:b.to.name,c:b.to.city}))}</h1></div><div class="pills">${stagePill(b)}${payPill(b)}</div></div>
 <section class="card">${track(b)}<p class="say">${esc(sentence(b))}</p>${etaBlock(b)}</section>
 <div class="acts">${b.status==='sl_wh'?`<button class="btn big ${b.addrOk?'':'lime'}" onclick="openAddr('${b.id}')">${ic('map')} ${b.addrOk?T('changeDelivery'):T('chooseDelivery')}</button>`:''}${bal(b)?`<button class="btn pri big" onclick="openCPay('${b.id}')">${ic('card')} ${T('payNow')} ${ils(bal(b))}</button>`:''}<a class="btn big" href="${telHref('+972 3 555 0199')}">${ic('phone')} ${T('callUs')}</a></div>
 <div class="grid g2"><section class="card"><h3><span class="chipic">${ic('pin',18)}</span>${T('receiver')}</h3>${kv(T('name'),esc(b.to.name))}${kv(T('phone'),esc(b.to.phone))}${kv(T('address'),esc(b.to.addr))}${kv(T('delivery'),b.mode==='point'?esc(b.point||T('pickupPoint')):T('homeDelivery'))}</section>
 <section class="card"><h3><span class="chipic">${ic('box',18)}</span>${T('theBox')}</h3>${kv(T('weight'),b.weight?b.weight+' kg':'~'+b.est+' kg')}${kv(T('price'),ils(b.price))}${kv(T('paid'),ils(paidOf(b)))}${kv(T('balance'),ils(bal(b)))}</section></div>
 <section class="card"><h3><span class="chipic">${ic('clock',18)}</span>${T('history')}</h3><ol class="hist">${[...b.hist].reverse().filter(h=>h.st!=='load').map(h=>`<li><div><b>${histLabel(h)}${h.st==='pay'&&h.note?': '+esc(h.note):''}</b><small>${fdt(h.at)}</small></div></li>`).join('')}</ol></section>`}
function openCPay(id){const b=B(id),due=bal(b);
 modal(T('payTitle'),`<div class="pricebox"><span>${b.id}</span><b>${ils(due)}</b></div>
 <div class="field"><label for="ccn">${T('cardNo')}</label><input id="ccn" inputmode="numeric" value="4242 4242 4242 4242"></div>
 <div class="two"><div class="field"><label for="cce">${T('expiry')}</label><input id="cce" value="12/28"></div><div class="field"><label for="ccc">${T('cvc')}</label><input id="ccc" inputmode="numeric" value="123"></div></div>

function doCPay(id,due){const btn=$('cpb');btn.disabled=true;btn.textContent=T('paying');
 setTimeout(()=>{const b=B(id);b.pays.push({amt:due,cur:'ILS',method:'online',at:Date.now(),by:C(b.cust).name});b.hist.push({st:'pay',at:Date.now(),by:C(b.cust).name,note:ils(due)});notify(b,'n_paid',{id:b.id,amt:ils(due)},true);save();
  modal(T('payTitle'),`<div class="done-ok"><div class="chipic">${ic('check',36)}</div><h2 style="justify-content:center">${T('payDone')}</h2><p class="muted">${ils(due)}</p></div>`,`<button class="btn pri" onclick="closeM();render()">${T('close')}</button>`)},900)}
function vCSend(){const c=C(S.user.id);
 return `${backBtn()}<div class="hello"><h1>${T('sendBox')}</h1></div><div class="grid g2"><section class="card">
 <div class="field"><label for="rqa">${T('pickupAddr')}</label><input id="rqa" value="${esc(c.addr)}"></div>
 <div class="field"><label for="rqd">${T('whenPickup')}</label><input id="rqd" type="date" value="${dayISO(2)}"></div>
 <div class="field"><label for="rqk">${T('estWeight')}</label><input id="rqk" class="in-big" type="number" inputmode="decimal" value="20" oninput="$('rqp').textContent=ils((parseFloat(this.value)||0)*${DB.settings.rate})"></div>
 <div class="pricebox"><span>${T('price')} (~)</span><b id="rqp">${ils(20*DB.settings.rate)}</b></div>
 <div class="field"><label for="rqn">${T('note')}</label><textarea id="rqn"></textarea></div>
 <button class="btn pri big" onclick="sendRequest()">${ic('truck')} ${T('requestPickup')}</button></section>
 <section class="card"><a class="btn big" href="${telHref('+972 3 555 0199')}">${ic('phone')} ${T('callUs')}</a></section></div>`}
function sendRequest(){const c=C(S.user.id),kg=$('rqk').value,d=$('rqd').value;
 DB.calls.unshift({id:'k'+Date.now(),cust:c.id,name:c.name,phone:c.phone,note:`${kg} kg, ${fd(d)}. ${$('rqa').value.trim()}. ${$('rqn').value.trim()}`.trim(),out:'request',at:Date.now(),done:false});save();
 $('main').innerHTML=`<section class="card done-ok" style="margin-top:20px"><div class="chipic">${ic('check',36)}</div><h2 style="justify-content:center">${T('requestSent')}</h2><p><button class="btn pri" style="margin-top:14px" onclick="go('home')">${T('myBoxes')}</button></p></section>`}
function vCMsgs(){const m=DB.msgs.filter(x=>x.cust===S.user.id);return `<div class="hello"><h1>${T('messages')}</h1></div><div class="bubbles">${m.length?m.map(x=>bubble(x)).join(''):`<div class="empty">${T('noMine')}</div>`}</div>`}


/* swipe + drag for horizontal rows (touch swipes natively; mouse can drag or use the wheel) */
function initSwipe(){document.querySelectorAll('.nav,.chips.scroll').forEach(el=>{if(el.dataset.sw)return;el.dataset.sw=1;
 let down=false,sx=0,sl=0,moved=false;
 const edge=()=>{const max=el.scrollWidth-el.clientWidth;el.classList.toggle('at-end',el.scrollLeft>=max-2);el.classList.toggle('mid',el.scrollLeft>2)};
 el.addEventListener('scroll',edge,{passive:true});edge();
 el.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;down=true;moved=false;sx=e.clientX;sl=el.scrollLeft});
 window.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-sx;if(Math.abs(dx)>5){moved=true;el.classList.add('drag')}el.scrollLeft=sl-dx});
 window.addEventListener('pointerup',()=>{down=false;el.classList.remove('drag')});
 el.addEventListener('click',e=>{if(moved){e.preventDefault();e.stopPropagation();moved=false}},true);
 el.addEventListener('wheel',e=>{if(el.scrollWidth<=el.clientWidth||Math.abs(e.deltaX)>Math.abs(e.deltaY))return;e.preventDefault();el.scrollLeft+=e.deltaY},{passive:false});
 const on=el.querySelector('.on');if(on&&on.offsetLeft+on.offsetWidth>el.clientWidth)el.scrollLeft=on.offsetLeft-el.clientWidth/2+on.offsetWidth/2;edge();
});}
/* ---------------- start ---------------- */
if(S.route&&ROUTES[S.route])load();else{S.route=null;S.user=null}
if(S.user&&DB&&((S.user.t==='staff'&&!ST(S.user.id))||(S.user.t==='customer'&&!DB.customers.find(c=>c.id===S.user.id))))S.user=null;
hReset();
render();
